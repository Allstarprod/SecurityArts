<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SecurityArts — Studio</title>
<script>try{var t=localStorage.getItem('sa-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="icon" href="../../assets/favicon.svg" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--ink); color: var(--bone); font-family: var(--font-sans); font-weight: 360; font-size: var(--fs-body); line-height: var(--lh-relaxed); letter-spacing: var(--ls-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--brass); color: var(--ink); }

  .wrap { max-width: var(--maxw); margin-inline: auto; }
  .pad { padding-inline: var(--gutter); }

  /* header */
  .head { position: sticky; top: 0; z-index: 80; display: flex; align-items: center; gap: 2rem; padding: 1.1rem var(--gutter); background: color-mix(in srgb, var(--ink) 78%, transparent); backdrop-filter: blur(var(--blur-bar)); border-bottom: 1px solid transparent; transition: border-color 0.4s var(--ease), background 0.4s var(--ease); }
  .head.stuck { border-bottom-color: var(--line); background: color-mix(in srgb, var(--ink) 90%, transparent); }
  .brand { display: inline-flex; align-items: center; gap: 0.62rem; }
  .brand__word { font-family: var(--font-serif); font-weight: 460; font-size: 1.32rem; letter-spacing: -0.01em; }
  .brand svg { transition: transform 0.9s var(--ease); }
  .brand:hover svg { transform: rotate(22.5deg); }
  .nav { display: flex; gap: 1.9rem; margin-left: auto; }
  .nav a { font-family: var(--font-mono); font-size: 0.76rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--bone-dim); display: inline-flex; gap: 0.4rem; align-items: baseline; transition: color 0.25s var(--ease); }
  .nav a:hover { color: var(--bone); }
  .nav i { color: var(--brass); font-size: 0.62rem; font-style: normal; }
  .menu-btn { display: none; flex-direction: column; gap: 6px; width: 44px; height: 44px; align-items: center; justify-content: center; background: none; border: 0; cursor: pointer; margin-left: auto; }
  .menu-btn span { width: 26px; height: 1.5px; background: var(--bone); transition: transform 0.35s var(--ease), opacity 0.35s var(--ease); }
  .menu-btn.open span:first-child { transform: translateY(3.75px) rotate(45deg); }
  .menu-btn.open span:last-child { transform: translateY(-3.75px) rotate(-45deg); }

  /* mobile menu */
  .mmenu { position: fixed; inset: 0; z-index: 79; background: var(--ink); padding: 6rem var(--gutter) 3rem; display: flex; flex-direction: column; justify-content: space-between; transform: translateY(-100%); transition: transform 0.55s var(--ease); visibility: hidden; }
  .mmenu.open { transform: translateY(0); visibility: visible; }
  .mmenu a { font-family: var(--font-serif); font-size: clamp(2rem, 12vw, 3rem); font-weight: 380; padding: 0.5rem 0; border-bottom: 1px solid var(--line); display: flex; gap: 1rem; align-items: baseline; }
  .mmenu a i { font: 500 0.8rem var(--font-mono); color: var(--brass); font-style: normal; }

  /* hero */
  .hero { position: relative; min-height: clamp(600px, 88vh, 940px); padding: clamp(3rem,7vw,7rem) var(--gutter) 2.5rem; display: flex; flex-direction: column; overflow: hidden; }
  .hero__bleed { position: absolute; top: 50%; right: clamp(-22rem,-16vw,-7rem); transform: translateY(-50%); width: clamp(26rem,52vw,48rem); aspect-ratio: 1; color: rgba(244,241,233,0.07); pointer-events: none; }
  .hero__inner { position: relative; margin-top: auto; max-width: 1100px; }
  .hero__title { font-family: var(--font-serif); font-optical-sizing: auto; font-weight: 340; font-size: var(--fs-hero); line-height: 0.92; letter-spacing: var(--ls-hero); }
  .hero__title span { display: block; }
  .hero__title em { color: var(--brass); font-style: italic; font-weight: 360; }
  .hero__aside { display: grid; gap: 1.8rem; margin-top: clamp(2rem,4vw,3.2rem); max-width: 640px; margin-left: auto; }
  .hero__lede { color: var(--bone-dim); font-size: var(--fs-lede); line-height: 1.55; }
  .hero__actions { display: flex; flex-wrap: wrap; gap: 0.9rem; }
  .hero__foot { display: flex; flex-wrap: wrap; gap: 2.5rem; margin-top: clamp(2.5rem,5vw,4rem); padding-top: 1.5rem; border-top: 1px solid var(--line); }
  .meta { display: flex; flex-direction: column; gap: 0.4rem; }
  .meta--end { margin-left: auto; text-align: right; }
  .meta-k { font: 500 0.68rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.18em; color: var(--bone-faint); }
  .meta-v { font-size: 0.92rem; color: var(--bone-dim); }
  .eyebrow-wrap { margin-bottom: clamp(1.4rem,3vw,2.4rem); }

  /* generic section */
  .band { padding: var(--section-y) var(--gutter); }
  .band--sm { padding: var(--section-y-sm) var(--gutter); }
  .h-section { font-family: var(--font-serif); font-optical-sizing: auto; font-weight: 380; font-size: var(--fs-section); line-height: 1.02; letter-spacing: -0.022em; }
  .lbl { margin-bottom: 1.6rem; }

  /* manifesto */
  .manifesto { display: grid; grid-template-columns: minmax(0,0.9fr) minmax(0,3.1fr); gap: clamp(1.5rem,4vw,4rem); }
  .manifesto__text { font-family: var(--font-serif); font-weight: 360; font-optical-sizing: auto; font-size: var(--fs-quote); line-height: 1.16; letter-spacing: -0.018em; }
  .ul { font-style: italic; color: var(--brass); position: relative; white-space: nowrap; }
  .ul::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0.06em; height: 2px; background: var(--brass); }

  /* practice grid */
  .phead { display: grid; gap: 1.4rem; margin-bottom: clamp(2.5rem,6vw,4.5rem); max-width: 1000px; }
  .pintro { color: var(--bone-dim); max-width: 52ch; }
  @media (min-width: 900px) { .phead { grid-template-columns: 1.4fr 1fr; align-items: end; } .phead .lbl { grid-column: 1 / -1; } }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; }
  .grid > * { grid-column: span 3; }
  .grid > .wide { grid-column: span 6; }

  /* seal section */
  .sealsec { display: grid; gap: clamp(2.5rem,6vw,5rem); align-items: center; border-top: 1px solid var(--line); }
  @media (min-width: 920px) { .sealsec { grid-template-columns: 0.85fr 1.15fr; } }
  .sealsec__art { display: flex; justify-content: center; color: var(--bone); }
  .sealsec__lede { color: var(--bone-dim); font-size: var(--fs-lede); line-height: 1.6; max-width: 56ch; margin-top: 0.4rem; }
  .sealsec__lede em { color: var(--bone); font-style: italic; }
  .points { list-style: none; margin-top: 2.4rem; }
  .points li { display: grid; gap: 0.25rem; padding: 1.1rem 0; border-top: 1px solid var(--line); }
  @media (min-width: 560px) { .points li { grid-template-columns: 9rem 1fr; gap: 1.5rem; align-items: baseline; } }
  .points__k { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.74rem; color: var(--brass); }
  .points__v { color: var(--bone-dim); }

  /* identity (light flip) */
  .identity { background: var(--cream); color: var(--jet); padding: clamp(4.5rem,10vw,9rem) var(--gutter); }
  .identity > * { max-width: var(--maxw); margin-inline: auto; }
  .identity .lbl { color: #6a6356; }
  .identity__title { font-family: var(--font-serif); font-weight: 380; font-size: clamp(2.4rem,1rem+6vw,5.6rem); line-height: 0.98; letter-spacing: -0.03em; }
  .identity__intro { color: #4a4439; max-width: 56ch; margin-top: 1.2rem; }
  .surfaces { display: grid; grid-template-columns: repeat(4,1fr); gap: clamp(0.5rem,1.2vw,0.9rem); margin: clamp(2rem,4vw,3rem) 0; }
  .surface { aspect-ratio: 1; border-radius: var(--radius-lg); display: grid; place-items: center; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(0.5rem,1.2vw,0.9rem); }
  @media (max-width: 640px) { .pair { grid-template-columns: 1fr; } .surfaces { grid-template-columns: repeat(2,1fr); } }
  .lockup { border-radius: var(--radius-lg); padding: clamp(1.6rem,3vw,2.4rem); display: flex; flex-direction: column; justify-content: space-between; gap: 2.5rem; min-height: 190px; }
  .lockup--light { background: #f3efe6; border: 1px solid rgba(16,15,14,0.1); }
  .lockup--dark { background: var(--ink); color: var(--bone); }
  .lockup__mark { display: flex; align-items: center; gap: 0.7rem; }
  .lockup__word { font-family: var(--font-serif); font-weight: 470; font-size: clamp(1.5rem,1rem+1.6vw,2.1rem); letter-spacing: -0.015em; }
  .lockup figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; border-top: 1px solid currentColor; padding-top: 0.8rem; font-size: 0.92rem; }
  .lockup figcaption .a { font-family: var(--font-serif); font-style: italic; font-size: 1.05rem; }
  .lockup figcaption .b { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.12em; }
  .lockup--light .b { color: #6a6356; } .lockup--light figcaption { border-top-color: rgba(16,15,14,0.18); }
  .lockup--dark .b { color: var(--bone-dim); } .lockup--dark figcaption { border-top-color: var(--line-strong); }

  /* standards */
  .std { list-style: none; display: grid; grid-template-columns: repeat(2,1fr); border-top: 1px solid var(--line); }
  @media (min-width: 700px) { .std { grid-template-columns: repeat(3,1fr); } }
  @media (min-width: 1000px) { .std { grid-template-columns: repeat(6,1fr); } }
  .std li { font-family: var(--font-serif); font-weight: 400; font-size: clamp(1.1rem,0.9rem+0.9vw,1.7rem); color: var(--bone-dim); padding: clamp(1.4rem,3vw,2.2rem) 0.5rem; text-align: center; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); display: flex; align-items: center; justify-content: center; transition: color 0.3s var(--ease), background 0.3s var(--ease); }
  .std li:hover { color: var(--bone); background: var(--ink-2); }

  /* contact */
  .contact { border-top: 1px solid var(--line); }
  .contact__title { font-family: var(--font-serif); font-weight: 350; font-size: var(--fs-display); line-height: 0.94; letter-spacing: -0.035em; margin-bottom: clamp(2.5rem,5vw,4rem); }
  .contact__row { display: grid; gap: 1.8rem; align-items: end; }
  @media (min-width: 800px) { .contact__row { grid-template-columns: 1.3fr 1fr; } }
  .mail { font-family: var(--font-serif); font-style: italic; font-weight: 400; font-size: clamp(1.4rem,1rem+2.2vw,2.6rem); width: fit-content; position: relative; }
  .mail:hover { color: var(--brass); }
  .contact__note { color: var(--bone-dim); max-width: 42ch; }

  /* newsletter */
  .news { border-top: 1px solid var(--line); }
  .news__inner { max-width: 760px; }
  .news__title { font-family: var(--font-serif); font-weight: 360; font-size: clamp(2rem,1rem+4vw,3.6rem); line-height: 1; letter-spacing: -0.025em; margin: 1.2rem 0; }
  .news__lede { color: var(--bone-dim); max-width: 50ch; margin-bottom: 2rem; }
  .news__form { display: flex; flex-wrap: wrap; gap: 0.7rem; max-width: 520px; }
  .news__form .sa-inputwrap, .news__form > *:first-child { flex: 1 1 240px; }
  .news__note { margin-top: 1rem; font-family: var(--font-mono); font-size: 0.74rem; min-height: 1.2em; color: var(--brass); }

  /* footer */
  .foot { border-top: 1px solid var(--line); padding: clamp(2.5rem,5vw,4rem) var(--gutter); }
  .foot__top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2rem; align-items: center; padding-bottom: clamp(2.5rem,5vw,4rem); border-bottom: 1px solid var(--line); }
  .foot__nav { display: flex; flex-wrap: wrap; gap: 1.6rem; }
  .foot__nav a { font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); transition: color 0.25s var(--ease); }
  .foot__nav a:hover { color: var(--bone); }
  .foot__base { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; padding-top: 1.6rem; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.14em; color: var(--bone-faint); }

  @media (max-width: 1024px) { .nav { display: none; } .head-cta-wrap { display: none; } .menu-btn { display: flex; } .grid > *, .grid > .wide { grid-column: 1 / -1; } .manifesto { grid-template-columns: 1fr; } .theme-btn { margin-left: auto; } }

  .theme-btn { margin-left: 0.6rem; }
  .grain { position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0.045; mix-blend-mode: overlay; background-image: var(--grain-url); }
</style>
</head>
