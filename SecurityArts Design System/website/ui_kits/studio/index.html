<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--ink); color: var(--bone); font-family: var(--font-sans); font-weight: 360; font-size: var(--fs-body); line-height: var(--lh-relaxed); letter-spacing: var(--ls-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--brass); color: var(--ink); }

  .wrap { max-width: var(--maxw); margin-inline: auto; }
  .pad { padding-inline: var(--gutter); }

  /* header */
  .head { position: sticky; top: 0; z-index: 80; display: flex; align-items: center; gap: 2rem; padding: 1.1rem var(--gutter); background: color-mix(in srgb, var(--ink) 78%, transparent); backdrop-filter: blur(var(--blur-bar)); border-bottom: 1px solid transparent; transition: border-color 0.4s var(--ease), background 0.4s var(--ease); }
  .head.stuck { border-bottom-color: var(--line); background: color-mix(in srgb, var(--ink) 90%, transparent); }
  .brand { display: inline-flex; align-items: center; gap: 0.62rem; }
  .brand__word { font-family: var(--font-serif); font-weight: 460; font-size: 1.32rem; letter-spacing: -0.01em; }
  .brand svg { transition: transform 0.9s var(--ease); }
  .brand:hover svg { transform: rotate(22.5deg); }
  .nav { display: flex; gap: 1.9rem; margin-left: auto; }
  .nav a { font-family: var(--font-mono); font-size: 0.76rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--bone-dim); display: inline-flex; gap: 0.4rem; align-items: baseline; transition: color 0.25s var(--ease); }
  .nav a:hover { color: var(--bone); }
  .nav i { color: var(--brass); font-size: 0.62rem; font-style: normal; }
  .menu-btn { display: none; flex-direction: column; gap: 6px; width: 44px; height: 44px; align-items: center; justify-content: center; background: none; border: 0; cursor: pointer; margin-left: auto; }
  .menu-btn span { width: 26px; height: 1.5px; background: var(--bone); transition: transform 0.35s var(--ease), opacity 0.35s var(--ease); }
  .menu-btn.open span:first-child { transform: translateY(3.75px) rotate(45deg); }
  .menu-btn.open span:last-child { transform: translateY(-3.75px) rotate(-45deg); }

  /* mobile menu */
  .mmenu { position: fixed; inset: 0; z-index: 79; background: var(--ink); padding: 6rem var(--gutter) 3rem; display: flex; flex-direction: column; justify-content: space-between; transform: translateY(-100%); transition: transform 0.55s var(--ease); visibility: hidden; }
  .mmenu.open { transform: translateY(0); visibility: visible; }
  .mmenu a { font-family: var(--font-serif); font-size: clamp(2rem, 12vw, 3rem); font-weight: 380; padding: 0.5rem 0; border-bottom: 1px solid var(--line); display: flex; gap: 1rem; align-items: baseline; }
  .mmenu a i { font: 500 0.8rem var(--font-mono); color: var(--brass); font-style: normal; }

  /* hero */
  .hero { position: relative; min-height: clamp(600px, 88vh, 940px); padding: clamp(3rem,7vw,7rem) var(--gutter) 2.5rem; display: flex; flex-direction: column; overflow: hidden; }
  .hero__bleed { position: absolute; top: 50%; right: clamp(-22rem,-16vw,-7rem); transform: translateY(-50%); width: clamp(26rem,52vw,48rem); aspect-ratio: 1; color: rgba(244,241,233,0.07); pointer-events: none; }
  .hero__inner { position: relative; margin-top: auto; max-width: 1100px; }
  .hero__title { font-family: var(--font-serif); font-optical-sizing: auto; font-weight: 340; font-size: var(--fs-hero); line-height: 0.92; letter-spacing: var(--ls-hero); }
  .hero__title span { display: block; }
  .hero__title em { color: var(--brass); font-style: italic; font-weight: 360; }
  .hero__aside { display: grid; gap: 1.8rem; margin-top: clamp(2rem,4vw,3.2rem); max-width: 640px; margin-left: auto; }
  .hero__lede { color: var(--bone-dim); font-size: var(--fs-lede); line-height: 1.55; }
  .hero__actions { display: flex; flex-wrap: wrap; gap: 0.9rem; }
  .hero__foot { display: flex; flex-wrap: wrap; gap: 2.5rem; margin-top: clamp(2.5rem,5vw,4rem); padding-top: 1.5rem; border-top: 1px solid var(--line); }
  .meta { display: flex; flex-direction: column; gap: 0.4rem; }
  .meta--end { margin-left: auto; text-align: right; }
  .meta-k { font: 500 0.68rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.18em; color: var(--bone-faint); }
  .meta-v { font-size: 0.92rem; color: var(--bone-dim); }
  .eyebrow-wrap { margin-bottom: clamp(1.4rem,3vw,2.4rem); }

  /* generic section */
  .band { padding: var(--section-y) var(--gutter); }
  .band--sm { padding: var(--section-y-sm) var(--gutter); }
  .h-section { font-family: var(--font-serif); font-optical-sizing: auto; font-weight: 380; font-size: var(--fs-section); line-height: 1.02; letter-spacing: -0.022em; }
  .lbl { margin-bottom: 1.6rem; }

  /* manifesto */
  .manifesto { display: grid; grid-template-columns: minmax(0,0.9fr) minmax(0,3.1fr); gap: clamp(1.5rem,4vw,4rem); }
  .manifesto__text { font-family: var(--font-serif); font-weight: 360; font-optical-sizing: auto; font-size: var(--fs-quote); line-height: 1.16; letter-spacing: -0.018em; }
  .ul { font-style: italic; color: var(--brass); position: relative; white-space: nowrap; }
  .ul::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0.06em; height: 2px; background: var(--brass); }

  /* practice grid */
  .phead { display: grid; gap: 1.4rem; margin-bottom: clamp(2.5rem,6vw,4.5rem); max-width: 1000px; }
  .pintro { color: var(--bone-dim); max-width: 52ch; }
  @media (min-width: 900px) { .phead { grid-template-columns: 1.4fr 1fr; align-items: end; } .phead .lbl { grid-column: 1 / -1; } }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; }
  .grid > * { grid-column: span 3; }
  .grid > .wide { grid-column: span 6; }

  /* seal section */
  .sealsec { display: grid; gap: clamp(2.5rem,6vw,5rem); align-items: center; border-top: 1px solid var(--line); }
  @media (min-width: 920px) { .sealsec { grid-template-columns: 0.85fr 1.15fr; } }
  .sealsec__art { display: flex; justify-content: center; color: var(--bone); }
  .sealsec__lede { color: var(--bone-dim); font-size: var(--fs-lede); line-height: 1.6; max-width: 56ch; margin-top: 0.4rem; }
  .sealsec__lede em { color: var(--bone); font-style: italic; }
  .points { list-style: none; margin-top: 2.4rem; }
  .points li { display: grid; gap: 0.25rem; padding: 1.1rem 0; border-top: 1px solid var(--line); }
  @media (min-width: 560px) { .points li { grid-template-columns: 9rem 1fr; gap: 1.5rem; align-items: baseline; } }
  .points__k { font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.14em; font-size: 0.74rem; color: var(--brass); }
  .points__v { color: var(--bone-dim); }

  /* identity (light flip) */
  .identity { background: var(--cream); color: var(--jet); padding: clamp(4.5rem,10vw,9rem) var(--gutter); }
  .identity > * { max-width: var(--maxw); margin-inline: auto; }
  .identity .lbl { color: #6a6356; }
  .identity__title { font-family: var(--font-serif); font-weight: 380; font-size: clamp(2.4rem,1rem+6vw,5.6rem); line-height: 0.98; letter-spacing: -0.03em; }
  .identity__intro { color: #4a4439; max-width: 56ch; margin-top: 1.2rem; }
  .surfaces { display: grid; grid-template-columns: repeat(4,1fr); gap: clamp(0.5rem,1.2vw,0.9rem); margin: clamp(2rem,4vw,3rem) 0; }
  .surface { aspect-ratio: 1; border-radius: var(--radius-lg); display: grid; place-items: center; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(0.5rem,1.2vw,0.9rem); }
  @media (max-width: 640px) { .pair { grid-template-columns: 1fr; } .surfaces { grid-template-columns: repeat(2,1fr); } }
  .lockup { border-radius: var(--radius-lg); padding: clamp(1.6rem,3vw,2.4rem); display: flex; flex-direction: column; justify-content: space-between; gap: 2.5rem; min-height: 190px; }
  .lockup--light { background: #f3efe6; border: 1px solid rgba(16,15,14,0.1); }
  .lockup--dark { background: var(--ink); color: var(--bone); }
  .lockup__mark { display: flex; align-items: center; gap: 0.7rem; }
  .lockup__word { font-family: var(--font-serif); font-weight: 470; font-size: clamp(1.5rem,1rem+1.6vw,2.1rem); letter-spacing: -0.015em; }
  .lockup figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; border-top: 1px solid currentColor; padding-top: 0.8rem; font-size: 0.92rem; }
  .lockup figcaption .a { font-family: var(--font-serif); font-style: italic; font-size: 1.05rem; }
  .lockup figcaption .b { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.12em; }
  .lockup--light .b { color: #6a6356; } .lockup--light figcaption { border-top-color: rgba(16,15,14,0.18); }
  .lockup--dark .b { color: var(--bone-dim); } .lockup--dark figcaption { border-top-color: var(--line-strong); }

  /* standards */
  .std { list-style: none; display: grid; grid-template-columns: repeat(2,1fr); border-top: 1px solid var(--line); }
  @media (min-width: 700px) { .std { grid-template-columns: repeat(3,1fr); } }
  @media (min-width: 1000px) { .std { grid-template-columns: repeat(6,1fr); } }
  .std li { font-family: var(--font-serif); font-weight: 400; font-size: clamp(1.1rem,0.9rem+0.9vw,1.7rem); color: var(--bone-dim); padding: clamp(1.4rem,3vw,2.2rem) 0.5rem; text-align: center; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); display: flex; align-items: center; justify-content: center; transition: color 0.3s var(--ease), background 0.3s var(--ease); }
  .std li:hover { color: var(--bone); background: var(--ink-2); }

  /* contact */
  .contact { border-top: 1px solid var(--line); }
  .contact__title { font-family: var(--font-serif); font-weight: 350; font-size: var(--fs-display); line-height: 0.94; letter-spacing: -0.035em; margin-bottom: clamp(2.5rem,5vw,4rem); }
  .contact__row { display: grid; gap: 1.8rem; align-items: end; }
  @media (min-width: 800px) { .contact__row { grid-template-columns: 1.3fr 1fr; } }
  .mail { font-family: var(--font-serif); font-style: italic; font-weight: 400; font-size: clamp(1.4rem,1rem+2.2vw,2.6rem); width: fit-content; position: relative; }
  .mail:hover { color: var(--brass); }
  .contact__note { color: var(--bone-dim); max-width: 42ch; }

  /* newsletter */
  .news { border-top: 1px solid var(--line); }
  .news__inner { max-width: 760px; }
  .news__title { font-family: var(--font-serif); font-weight: 360; font-size: clamp(2rem,1rem+4vw,3.6rem); line-height: 1; letter-spacing: -0.025em; margin: 1.2rem 0; }
  .news__lede { color: var(--bone-dim); max-width: 50ch; margin-bottom: 2rem; }
  .news__form { display: flex; flex-wrap: wrap; gap: 0.7rem; max-width: 520px; }
  .news__form .sa-inputwrap, .news__form > *:first-child { flex: 1 1 240px; }
  .news__note { margin-top: 1rem; font-family: var(--font-mono); font-size: 0.74rem; min-height: 1.2em; color: var(--brass); }

  /* footer */
  .foot { border-top: 1px solid var(--line); padding: clamp(2.5rem,5vw,4rem) var(--gutter); }
  .foot__top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2rem; align-items: center; padding-bottom: clamp(2.5rem,5vw,4rem); border-bottom: 1px solid var(--line); }
  .foot__nav { display: flex; flex-wrap: wrap; gap: 1.6rem; }
  .foot__nav a { font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); transition: color 0.25s var(--ease); }
  .foot__nav a:hover { color: var(--bone); }
  .foot__base { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; padding-top: 1.6rem; font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.14em; color: var(--bone-faint); }

  @media (max-width: 1024px) { .nav { display: none; } .head-cta-wrap { display: none; } .menu-btn { display: flex; } .grid > *, .grid > .wide { grid-column: 1 / -1; } .manifesto { grid-template-columns: 1fr; } .theme-btn { margin-left: auto; } }

  .theme-btn { margin-left: 0.6rem; }
  .grain { position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0.045; mix-blend-mode: overlay; background-image: var(--grain-url); }
</style>

<body>
<div id="root"></div>
<div class="grain" aria-hidden="true"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../assets/transition.js"></script>
<script src="../../../../js/api.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
/* SecurityArts — Studio (marketing home) UI kit.
   A faithful recreation of the studio homepage, composed from the design-system
   components. Interactive: sticky header state + working mobile menu + newsletter. */
const { Seal, Marquee, Button, Eyebrow, SectionLabel, PracticeCard, Input, ThemeToggle } = window.SecurityArtsDesignSystem_f7e889;

const NAV = [
  ["01", "Practice", "#practice"], ["02", "The Seal", "#seal"],
  ["03", "Identity", "#identity"], ["04", "Standards", "#standards"], ["05", "Discover", "../discover/index.html"],
];

const PRACTICE = [
  { i: "01", t: "Offensive Security", wide: true, body: "We attack the way real adversaries do — not a checklist sweep. Goal-oriented red teaming, full-scope penetration testing, and adversary simulation that ends at the crown jewels, with the path written down.", tags: ["Red teaming", "Penetration testing", "Adversary simulation", "Social engineering"] },
  { i: "02", t: "Application Security", body: "Threat modeling, deep code review, and a secure SDLC your engineers will actually keep using after we leave.", tags: ["Code review", "Threat modeling", "Secure SDLC"] },
  { i: "03", t: "Cloud & Infrastructure", body: "AWS, GCP and Azure hardened against real attack paths. Identity, network, and infrastructure-as-code reviewed line by line.", tags: ["IAM & identity", "IaC review", "Segmentation"] },
  { i: "04", t: "Detection & Response", body: "Detection engineering and threat hunting that close the gap between breach and alert — plus the runbooks for the night it matters.", tags: ["Detection engineering", "Threat hunting", "IR readiness"] },
  { i: "05", t: "Security Architecture", body: "Design review before the build, not after the incident. Zero-trust, segmentation, and defensible boundaries drawn deliberately.", tags: ["Design review", "Zero-trust", "Boundary design"] },
  { i: "06", t: "Advisory & Training", brass: true, body: "Fractional CISO guidance and secure-by-design coaching that raises the floor for your whole team — so the next thing you build starts already sealed.", tags: ["vCISO", "Workshops", "Secure-by-design"] },
];

const SURFACES = [
  ["var(--sw-green)", "var(--bone)"], ["var(--sw-red)", "var(--bone)"], ["var(--sw-blue)", "var(--bone)"], ["var(--sw-gold)", "var(--jet)"],
  ["#f3efe6", "var(--jet)"], ["var(--sw-taupe)", "var(--bone)"], ["var(--ink)", "var(--bone)"], ["var(--bone)", "var(--jet)"],
];

const STANDARDS = ["OWASP", "MITRE ATT&CK", "NIST CSF", "ISO 27001", "SOC 2", "CIS Benchmarks"];

function Header({ onMenu, menuOpen, stuck }) {
  return (
    <header className={`head ${stuck ? "stuck" : ""}`}>
      <a className="brand" href="#top"><Seal size={30} /><span className="brand__word">SecurityArts</span></a>
      <nav className="nav">
        {NAV.map(([n, label, href]) => <a key={label} href={href}><i>{n}</i> {label}</a>)}
      </nav>
      <div style={{ marginLeft: "auto" }} className="head-cta-wrap">
        <Button size="sm" href="#contact" arrow>Request engagement</Button>
      </div>
      <ThemeToggle size={38} className="theme-btn" />
      <button className={`menu-btn ${menuOpen ? "open" : ""}`} onClick={onMenu} aria-label="Menu"><span></span><span></span></button>
    </header>
  );
}

function Hero() {
  return (
    <section className="hero" id="top">
      <div className="hero__bleed"><Seal size="100%" spin spinDuration="90s" /></div>
      <div className="hero__inner">
        <div className="eyebrow-wrap"><Eyebrow>Security studio — offensive &amp; defensive</Eyebrow></div>
        <h1 className="hero__title"><span>Security is</span><span>a craft. We</span><span>sign <em>our work.</em></span></h1>
        <div className="hero__aside">
          <p className="hero__lede">SecurityArts is a security studio. We break what you've built before an adversary does, harden what actually matters, and leave behind a mark you can verify — not a PDF you file away and forget.</p>
          <div className="hero__actions">
            <Button variant="solid" href="#contact">Request an engagement</Button>
            <Button variant="ghost" href="#practice">See the practice</Button>
          </div>
        </div>
      </div>
      <div className="hero__foot">
        <div className="meta"><span className="meta-k">Based</span><span className="meta-v">Remote-first · Worldwide</span></div>
        <div className="meta"><span className="meta-k">Engagements</span><span className="meta-v">Q3 2026 — limited</span></div>
        <div className="meta meta--end"><span className="meta-k">Est.</span><span className="meta-v">MMXXVI</span></div>
      </div>
    </section>
  );
}

function App() {
  const [menuOpen, setMenuOpen] = React.useState(false);
  const [stuck, setStuck] = React.useState(false);
  const [news, setNews] = React.useState("");
  const [newsMsg, setNewsMsg] = React.useState("");

  React.useEffect(() => {
    const onScroll = () => setStuck(window.scrollY > 24);
    onScroll(); window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  const submitNews = async (e) => {
    e.preventDefault();
    const email = news.trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { setNewsMsg("Enter a valid email address."); return; }
    try {
      if (window.SA_API) await window.SA_API.subscribe(email); // real backend capture
      else throw new Error("offline");
    } catch (_) {
      // Backend unreachable (opened statically) — keep it locally so nothing is lost.
      try {
        const list = JSON.parse(localStorage.getItem("sa_news") || "[]");
        if (list.indexOf(email) === -1) list.push(email);
        localStorage.setItem("sa_news", JSON.stringify(list));
      } catch (__) {}
    }
    setNewsMsg("You're on the list — watch your inbox for the seal."); setNews("");
  };

  return (
    <React.Fragment>
      <Header onMenu={() => setMenuOpen(!menuOpen)} menuOpen={menuOpen} stuck={stuck} />
      <div className={`mmenu ${menuOpen ? "open" : ""}`}>
        <nav>{NAV.map(([n, label, href]) => <a key={label} href={href} onClick={() => setMenuOpen(false)}><i>{n}</i> {label}</a>)}</nav>
        <a href="#contact" onClick={() => setMenuOpen(false)} style={{ fontFamily: "var(--font-mono)", textTransform: "uppercase", letterSpacing: "0.12em", fontSize: "0.85rem", color: "var(--brass)", border: 0 }}>Request an engagement →</a>
      </div>

      <main>
        <div className="wrap"><Hero /></div>
        <Marquee items={["Offensive Security", "Application Security", "Cloud & Infrastructure", "Detection & Response", "Security Architecture", "Advisory & Training"]} />

        <section className="wrap band manifesto">
          <SectionLabel index="00" className="lbl">Position</SectionLabel>
          <h2 className="manifesto__text">Most security work disappears into a report nobody reads twice. Ours ends in a <span className="ul">seal</span> — a verifiable record of what we tested, what we fixed, and what still needs your attention.</h2>
        </section>

        <section className="wrap band--sm pad" id="practice">
          <div className="phead">
            <SectionLabel index="01" className="lbl">Practice</SectionLabel>
            <h2 className="h-section">Six disciplines,<br />one standard of proof.</h2>
            <p className="pintro">We work across the full surface — the systems you ship, the cloud they run on, and the team that defends them. Each engagement is scoped to a named outcome, not a fixed bundle of hours.</p>
          </div>
          <div className="grid">
            {PRACTICE.map((p) => (
              <PracticeCard key={p.i} className={p.wide ? "wide" : ""} seamless index={p.i} title={p.t} variant={p.brass ? "brass" : "default"} tags={p.tags}>{p.body}</PracticeCard>
            ))}
          </div>
        </section>

        <section className="wrap band pad sealsec" id="seal">
          <div className="sealsec__art"><Seal size="clamp(15rem, 34vw, 26rem)" spin spinDuration="120s" /></div>
          <div>
            <SectionLabel index="02" className="lbl">The Seal</SectionLabel>
            <h2 className="h-section">Every engagement<br />ends in a mark.</h2>
            <p className="sealsec__lede">The seal is the whole idea. A notary's stamp says <em>a person stood here and verified this.</em> Ours says the same about your systems. When we close an engagement, you don't get a wall of findings — you get a record of exactly what was tested, what was proven safe, and what is still open, signed and dated.</p>
            <ul className="points">
              <li><span className="points__k">Verifiable</span><span className="points__v">Every claim traces to a test you can re-run.</span></li>
              <li><span className="points__k">Honest</span><span className="points__v">We mark what's still open as plainly as what's fixed.</span></li>
              <li><span className="points__k">Durable</span><span className="points__v">A retest re-issues the seal — it isn't a one-day snapshot.</span></li>
            </ul>
          </div>
        </section>

        <section className="identity" id="identity">
          <SectionLabel index="03" className="lbl">Identity</SectionLabel>
          <h2 className="identity__title">One logo. Any surface.</h2>
          <p className="identity__intro">The mark is contrast-aware. A single-ink master drops onto anything — from a billboard to a 16-pixel favicon — and takes black or white depending on what the surface needs.</p>
          <div className="surfaces">
            {SURFACES.map(([bg, fg], i) => <div key={i} className="surface" style={{ background: bg, color: fg }}><Seal size="46%" /></div>)}
          </div>
          <div className="pair">
            <figure className="lockup lockup--light"><div className="lockup__mark"><Seal size={42} /><span className="lockup__word">SecurityArts</span></div><figcaption><span className="a">Jet Black</span><span className="b">#0C0C0B · LIGHT BG</span></figcaption></figure>
            <figure className="lockup lockup--dark"><div className="lockup__mark"><Seal size={42} /><span className="lockup__word">SecurityArts</span></div><figcaption><span className="a">Pale White</span><span className="b">#F4F1E9 · DARK BG</span></figcaption></figure>
          </div>
        </section>

        <section className="wrap band pad" id="standards">
          <SectionLabel index="04" className="lbl">Standards</SectionLabel>
          <h2 className="h-section" style={{ marginBottom: "clamp(2.5rem,5vw,3.5rem)" }}>We work to the frameworks<br />your auditors already trust.</h2>
          <ul className="std">{STANDARDS.map((s) => <li key={s}>{s}</li>)}</ul>
        </section>

        <section className="wrap band pad contact" id="contact">
          <SectionLabel index="05" className="lbl">Contact</SectionLabel>
          <h2 className="contact__title">Let's put a mark<br />on it.</h2>
          <div className="contact__row">
            <a className="mail" href="mailto:hello@securityarts.studio">hello@securityarts.studio</a>
            <p className="contact__note">Tell us what you're protecting and what keeps you up at night. We reply to every serious enquiry within two business days.</p>
          </div>
        </section>

        <section className="wrap band--sm pad news">
          <div className="news__inner">
            <Eyebrow tone="brass" dot={false}>Newsletter</Eyebrow>
            <h2 className="news__title">Dispatches from the<br />authenticity economy.</h2>
            <p className="news__lede">Once a month: newly verified artists, how provenance is reshaping who gets paid for original work, and the tools we ship. No noise, no filler.</p>
            <form className="news__form" onSubmit={submitNews}>
              <Input shape="pill" type="email" placeholder="you@studio.com" value={news} onChange={(e) => setNews(e.target.value)} aria-label="Email address" />
              <Button variant="solid" type="submit" arrow>Subscribe</Button>
            </form>
            {newsMsg ? <p className="news__note">{newsMsg}</p> : null}
          </div>
        </section>
      </main>

      <footer className="wrap foot">
        <div className="foot__top">
          <a className="brand" href="#top"><Seal size={34} /><span className="brand__word" style={{ fontSize: "1.5rem" }}>SecurityArts</span></a>
          <nav className="foot__nav">
            <a href="#practice">Practice</a><a href="#seal">The Seal</a><a href="#identity">Identity</a>
            <a href="../discover/index.html">Discover</a><a href="../discover/welcome.html">Art platform</a><a href="../market/index.html">Market</a><a href="../discover/verify.html">Verify</a><a href="../discover/pricing.html">Pricing</a>
          </nav>
        </div>
        <div className="foot__base"><span>© MMXXVI SecurityArts</span><span>A security studio that signs its work</span></div>
      </footer>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
