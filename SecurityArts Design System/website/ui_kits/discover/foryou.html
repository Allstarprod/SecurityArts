<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For You — SecurityArts</title>
<script>try{var t=localStorage.getItem('sa-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="icon" href="../../assets/favicon.svg" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--bone); font-family: var(--font-sans); font-weight: 360; font-size: var(--fs-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; transition: background var(--dur-mid) var(--ease), color var(--dur-mid) var(--ease); }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--brass); color: var(--selection-fg, var(--ink)); }

  .appbar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: clamp(0.7rem,2vw,1.5rem); padding: 0.85rem var(--gutter-app); background: color-mix(in srgb, var(--ink) 90%, transparent); backdrop-filter: blur(var(--blur-bar)); border-bottom: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 0.6rem; }
  .brand svg { transition: transform 0.9s var(--ease); } .brand:hover svg { transform: rotate(22.5deg); }
  .brand__word { font-family: var(--font-serif); font-weight: 460; font-size: 1.28rem; letter-spacing: -0.01em; }
  .brand__sub { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.22em; color: var(--brass); text-transform: uppercase; align-self: flex-start; margin-top: 0.15rem; }
  .nav { display: flex; align-items: center; gap: 0.35rem; margin-left: auto; }
  .nav a { position: relative; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); padding: 0.55rem 0.7rem; border-radius: var(--radius-pill); transition: color 0.25s var(--ease), background 0.25s var(--ease); }
  .nav a:hover { color: var(--bone); background: var(--ink-3); }
  .nav a.active { color: var(--bone); }
  .nav a .dot { position: absolute; top: 0.35rem; right: 0.35rem; width: 6px; height: 6px; border-radius: 50%; background: var(--brass); }
  @media (max-width: 720px) { .nav a.optional { display: none; } }

  .wrap { max-width: 1240px; margin-inline: auto; padding-inline: var(--gutter-app); }
  .intro { padding: clamp(2.2rem,5vw,4rem) 0 clamp(1.2rem,3vw,2rem); }
  .intro__eyebrow { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--brass); display: inline-flex; align-items: center; gap: 0.5rem; }
  .intro h1 { font-family: var(--font-serif); font-weight: 340; font-optical-sizing: auto; font-size: clamp(2.4rem,1rem+5vw,4.6rem); line-height: 0.96; letter-spacing: -0.03em; margin: 1rem 0; }
  .intro h1 em { font-style: italic; color: var(--brass); }
  .intro p { color: var(--bone-dim); max-width: 54ch; font-size: var(--fs-lede); }
  .intro p b { color: var(--bone); font-weight: 460; }

  .section { margin: clamp(2rem,4vw,3.4rem) 0; }
  .section__head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.2rem; }
  .section__title { font-family: var(--font-serif); font-weight: 400; font-size: clamp(1.4rem,1rem+1.4vw,2rem); letter-spacing: -0.02em; }
  .section__title em { font-style: italic; color: var(--brass); }
  .section__link { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); white-space: nowrap; }
  .section__link:hover { color: var(--bone); }

  /* artists row */
  .artists { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .acard { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.7rem; padding: 1.4rem 1rem; border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--ink-2); transition: border-color 0.25s var(--ease), transform 0.3s var(--ease); }
  .acard:hover { border-color: var(--line-strong); transform: translateY(-3px); }
  .acard__name { font-family: var(--font-serif); font-weight: 440; font-size: 1.1rem; letter-spacing: -0.01em; }
  .acard__meta { font-family: var(--font-mono); font-size: 0.56rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-faint); }
  .acard__why { font-size: 0.78rem; color: var(--bone-dim); min-height: 2.4em; }

  /* work rows */
  .rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(190px, 220px); gap: 14px; overflow-x: auto; scrollbar-width: none; padding-bottom: 0.4rem; }
  .rail::-webkit-scrollbar { display: none; }
  .masonry { column-width: 230px; column-gap: 16px; }
  .masonry .sa-pin { margin: 0 0 16px; }
  @media (max-width: 520px) { .masonry { column-width: 160px; column-gap: 12px; } .masonry .sa-pin { margin-bottom: 12px; } }

  /* empty state */
  .empty { text-align: center; padding: clamp(2rem,5vw,4rem) 0 1rem; }
  .empty h2 { font-family: var(--font-serif); font-weight: 360; font-size: clamp(1.8rem,1rem+2.4vw,2.6rem); letter-spacing: -0.025em; margin-bottom: 0.6rem; }
  .empty p { color: var(--bone-dim); max-width: 46ch; margin: 0 auto 1.4rem; line-height: 1.55; }

  .foot { border-top: 1px solid var(--line); padding: 2.4rem var(--gutter-app); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; margin-top: 3rem; }
  .foot a { font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); }
  .foot a:hover { color: var(--bone); }
  .foot .m { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; color: var(--bone-faint); }

  .grain { position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0.045; mix-blend-mode: overlay; background-image: var(--grain-url); }
</style>
</head>
<body>
<div id="root"></div>
<div class="grain" aria-hidden="true"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../assets/catalog.js"></script>
<script src="../../assets/store.js"></script>
<script src="../../assets/genart.js"></script>
<script src="../../assets/transition.js"></script>
<script src="../../../../js/api.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { Seal, Icon, Button, Avatar, Pin, Toast, ThemeToggle } = window.SecurityArtsDesignSystem_f7e889;
const C = window.SACatalog, S = window.SAStore;

function useStoreTick() { const [, set] = React.useState(0); React.useEffect(() => S.subscribe(() => set((n) => n + 1)), []); }

function AppBar() {
  const pending = S.counts().pending;
  return (
    <header className="appbar">
      <a className="brand" href="index.html" aria-label="SecurityArts Discover">
        <Seal size={30} /><span className="brand__word">SecurityArts</span><span className="brand__sub">For You</span>
      </a>
      <nav className="nav">
        <a href="index.html">Discover</a>
        <a href="foryou.html" className="active">For You</a>
        <a href="dms.html">DMs{pending ? <span className="dot" /> : null}</a>
        <a href="verify.html" className="optional">Verify</a>
        <a href="me.html" className="optional">You</a>
        <a href="../market/index.html" className="optional">Market</a>
        <ThemeToggle size={38} />
      </nav>
    </header>
  );
}

const CAT_LABEL = { illustration: "Illustration", painting: "Painting", "3d": "3D & CGI", photography: "Photography", lettering: "Lettering", concept: "Concept art", mixed: "Mixed media" };

function PinCard({ w, onToast }) {
  const a = C.artistById[w.artistId];
  return (
    <a href={`profile.html?artist=${w.artistId}`} style={{ display: "block" }}>
      <Pin
        art={<img src={SAGenArt.dataUri(w.seed, { cat: w.cat })} alt={w.title} />}
        title={w.title} artist={a.name} badge="Verified"
        saved={S.isLiked(w.id)}
        onSave={() => { const n = S.toggleLike(w.id); onToast(n ? "Added to your likes" : "Removed"); }}
      />
    </a>
  );
}

function ArtistCard({ a, why, onToast }) {
  const following = S.isFollowing(a.id);
  return (
    <div className="acard">
      <a href={`profile.html?artist=${a.id}`}><Avatar name={a.name} size={72} verified /></a>
      <div>
        <a href={`profile.html?artist=${a.id}`}><div className="acard__name">{a.name}</div></a>
        <div className="acard__meta">{CAT_LABEL[a.cat]} · {a.city.split(",")[0]}</div>
      </div>
      <p className="acard__why">{why}</p>
      <Button variant={following ? "ghost" : "solid"} size="sm"
        onClick={() => { const n = S.toggleFollow(a.id); onToast(n ? "Following " + a.name : "Unfollowed"); }}>
        {following ? "Following" : "Follow"}
      </Button>
    </div>
  );
}

function App() {
  useStoreTick();
  const [toast, setToast] = React.useState("");
  const toastRef = React.useRef();
  const onToast = (m) => { setToast(m); clearTimeout(toastRef.current); toastRef.current = setTimeout(() => setToast(""), 1900); };

  const likedIds = S.likes();
  const liked = likedIds.map((id) => C.workById[id]).filter(Boolean);
  const likedArtistIds = Array.from(new Set(liked.map((w) => w.artistId)));
  const likedCats = Array.from(new Set(liked.map((w) => w.cat)));

  // recommended works: score by shared artist / category, exclude already-liked
  const recommended = C.works
    .filter((w) => likedIds.indexOf(w.id) === -1)
    .map((w) => ({ w, score: (likedArtistIds.indexOf(w.artistId) !== -1 ? 3 : 0) + (likedCats.indexOf(w.cat) !== -1 ? 2 : 0) + (w.seed % 3) * 0.1 }))
    .sort((a, b) => b.score - a.score)
    .map((x) => x.w);

  // artists for you: authored liked work, or work in a liked category
  const artistScore = {};
  C.artists.forEach((a) => {
    let s = 0;
    if (likedArtistIds.indexOf(a.id) !== -1) s += 3;
    if (likedCats.indexOf(a.cat) !== -1) s += 2;
    artistScore[a.id] = s;
  });
  const artistsForYou = C.artists
    .filter((a) => artistScore[a.id] > 0)
    .sort((a, b) => artistScore[b.id] - artistScore[a.id])
    .slice(0, 8);

  const whyArtist = (a) => {
    if (likedArtistIds.indexOf(a.id) !== -1) return "You liked their work";
    if (likedCats.indexOf(a.cat) !== -1) return "Because you like " + (CAT_LABEL[a.cat] || a.cat).toLowerCase();
    return "New to discover";
  };

  // "because you liked" — take the most recent liked work whose artist has siblings
  const because = liked.find((w) => (C.worksByArtist[w.artistId] || []).length > 1);
  const becauseWorks = because ? (C.worksByArtist[because.artistId] || []).filter((x) => x.id !== because.id) : [];

  const hasLikes = liked.length > 0;

  return (
    <React.Fragment>
      <AppBar />
      <div className="wrap">
        <section className="intro">
          <span className="intro__eyebrow"><Icon name="sparkle" size={14} /> For you · built from your taste</span>
          {hasLikes ? (
            <React.Fragment>
              <h1>More of what<br />you <em>love.</em></h1>
              <p>Built from the <b>{liked.length} work{liked.length > 1 ? "s" : ""}</b> you've liked{likedCats.length ? <> across <b>{likedCats.map((c) => (CAT_LABEL[c] || c).toLowerCase()).join(", ")}</b></> : null}. The more you like, the sharper this gets.</p>
            </React.Fragment>
          ) : (
            <React.Fragment>
              <h1>This page<br />becomes <em>yours.</em></h1>
              <p>Like a few works on <b>Discover</b> — or on any artist's profile — and SecurityArts starts surfacing the artists and pieces you'll want next, right here.</p>
            </React.Fragment>
          )}
        </section>

        {!hasLikes ? (
          <section className="section">
            <div className="section__head"><h2 className="section__title">Start here</h2><a className="section__link" href="index.html">Open Discover →</a></div>
            <div className="masonry">
              {C.works.slice(0, 12).map((w) => <PinCard key={w.id} w={w} onToast={onToast} />)}
            </div>
            <div className="empty">
              <p>Tap the save button on any piece to add it to your likes — the seal means a human made it.</p>
              <a href="index.html"><Button variant="solid" arrow>Browse the wall</Button></a>
            </div>
          </section>
        ) : (
          <React.Fragment>
            <section className="section">
              <div className="section__head"><h2 className="section__title">Artists <em>for you</em></h2></div>
              <div className="artists">
                {artistsForYou.map((a) => <ArtistCard key={a.id} a={a} why={whyArtist(a)} onToast={onToast} />)}
              </div>
            </section>

            {because && becauseWorks.length ? (
              <section className="section">
                <div className="section__head">
                  <h2 className="section__title">Because you liked <em>{because.title}</em></h2>
                  <a className="section__link" href={`profile.html?artist=${because.artistId}`}>{C.artistById[because.artistId].name} →</a>
                </div>
                <div className="rail">
                  {becauseWorks.map((w) => <div key={w.id} style={{ minWidth: 0 }}><PinCard w={w} onToast={onToast} /></div>)}
                </div>
              </section>
            ) : null}

            <section className="section">
              <div className="section__head"><h2 className="section__title">Recommended for you</h2></div>
              <div className="masonry">
                {recommended.slice(0, 15).map((w) => <PinCard key={w.id} w={w} onToast={onToast} />)}
              </div>
            </section>
          </React.Fragment>
        )}
      </div>

      <footer className="foot">
        <a href="index.html">← Back to Discover</a>
        <span className="m">Recommendations from your likes · Every work verified human</span>
      </footer>

      <Toast show={!!toast}>{toast}</Toast>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
