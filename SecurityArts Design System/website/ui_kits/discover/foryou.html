<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For You — SecurityArts</title>
<script>try{var t=localStorage.getItem('sa-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="icon" href="../../assets/favicon.svg" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--bone); font-family: var(--font-sans); font-weight: 360; font-size: var(--fs-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; transition: background var(--dur-mid) var(--ease), color var(--dur-mid) var(--ease); }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--brass); color: var(--selection-fg, var(--ink)); }

  .appbar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: clamp(0.7rem,2vw,1.5rem); padding: 0.85rem var(--gutter-app); background: color-mix(in srgb, var(--ink) 90%, transparent); backdrop-filter: blur(var(--blur-bar)); border-bottom: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 0.6rem; }
  .brand svg { transition: transform 0.9s var(--ease); } .brand:hover svg { transform: rotate(22.5deg); }
  .brand__word { font-family: var(--font-serif); font-weight: 460; font-size: 1.28rem; letter-spacing: -0.01em; }
  .brand__sub { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.22em; color: var(--brass); text-transform: uppercase; align-self: flex-start; margin-top: 0.15rem; }
  .nav { display: flex; align-items: center; gap: 0.35rem; margin-left: auto; }
  .nav a { position: relative; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); padding: 0.55rem 0.7rem; border-radius: var(--radius-pill); transition: color 0.25s var(--ease), background 0.25s var(--ease); }
  .nav a:hover { color: var(--bone); background: var(--ink-3); }
  .nav a.active { color: var(--bone); }
  .nav a .dot { position: absolute; top: 0.35rem; right: 0.35rem; width: 6px; height: 6px; border-radius: 50%; background: var(--brass); }
  @media (max-width: 720px) { .nav a.optional { display: none; } }

  .wrap { max-width: 1240px; margin-inline: auto; padding-inline: var(--gutter-app); }
  .intro { padding: clamp(2.2rem,5vw,4rem) 0 clamp(1.2rem,3vw,2rem); }
  .intro__eyebrow { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--brass); display: inline-flex; align-items: center; gap: 0.5rem; }
  .intro h1 { font-family: var(--font-serif); font-weight: 340; font-optical-sizing: auto; font-size: clamp(2.4rem,1rem+5vw,4.6rem); line-height: 0.96; letter-spacing: -0.03em; margin: 1rem 0; }
  .intro h1 em { font-style: italic; color: var(--brass); }
  .intro p { color: var(--bone-dim); max-width: 54ch; font-size: var(--fs-lede); }
  .intro p b { color: var(--bone); font-weight: 460; }

  .section { margin: clamp(2rem,4vw,3.4rem) 0; }
  .section__head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.2rem; }
  .section__title { font-family: var(--font-serif); font-weight: 400; font-size: clamp(1.4rem,1rem+1.4vw,2rem); letter-spacing: -0.02em; }
  .section__title em { font-style: italic; color: var(--brass); }
  .section__link { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); white-space: nowrap; }
  .section__link:hover { color: var(--bone); }

  /* artists row */
  .artists { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .acard { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0.7rem; padding: 1.4rem 1rem; border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--ink-2); transition: border-color 0.25s var(--ease), transform 0.3s var(--ease); }
  .acard:hover { border-color: var(--line-strong); transform: translateY(-3px); }
  .acard__name { font-family: var(--font-serif); font-weight: 440; font-size: 1.1rem; letter-spacing: -0.01em; }
  .acard__meta { font-family: var(--font-mono); font-size: 0.56rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-faint); }
  .acard__why { font-size: 0.78rem; color: var(--bone-dim); min-height: 2.4em; }

  /* work rows */
  .rail { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(190px, 220px); gap: 14px; overflow-x: auto; scrollbar-width: none; padding-bottom: 0.4rem; }
  .rail::-webkit-scrollbar { display: none; }
  .masonry { column-width: 230px; column-gap: 16px; }
  .masonry .sa-pin { margin: 0 0 16px; }
  @media (max-width: 520px) { .masonry { column-width: 160px; column-gap: 12px; } .masonry .sa-pin { margin-bottom: 12px; } }

  /* empty state */
  .empty { text-align: center; padding: clamp(2rem,5vw,4rem) 0 1rem; }
  .empty h2 { font-family: var(--font-serif); font-weight: 360; font-size: clamp(1.8rem,1rem+2.4vw,2.6rem); letter-spacing: -0.025em; margin-bottom: 0.6rem; }
  .empty p { color: var(--bone-dim); max-width: 46ch; margin: 0 auto 1.4rem; line-height: 1.55; }

  .foot { border-top: 1px solid var(--line); padding: 2.4rem var(--gutter-app); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; margin-top: 3rem; }
  .foot a { font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); }
  .foot a:hover { color: var(--bone); }
  .foot .m { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; color: var(--bone-faint); }

  .grain { position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0.045; mix-blend-mode: overlay; background-image: var(--grain-url); }
</style>
</head>
