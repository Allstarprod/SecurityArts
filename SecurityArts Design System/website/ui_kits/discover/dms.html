<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--ink); color: var(--bone); font-family: var(--font-sans); font-weight: 360; font-size: var(--fs-body); -webkit-font-smoothing: antialiased; overflow: hidden; display: flex; flex-direction: column; transition: background var(--dur-mid) var(--ease), color var(--dur-mid) var(--ease); }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--brass); color: var(--selection-fg, var(--ink)); }

  .appbar { flex: 0 0 auto; display: flex; align-items: center; gap: clamp(0.7rem,2vw,1.5rem); padding: 0.85rem var(--gutter-app); background: color-mix(in srgb, var(--ink) 90%, transparent); backdrop-filter: blur(var(--blur-bar)); border-bottom: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 0.6rem; }
  .brand svg { transition: transform 0.9s var(--ease); } .brand:hover svg { transform: rotate(22.5deg); }
  .brand__word { font-family: var(--font-serif); font-weight: 460; font-size: 1.28rem; letter-spacing: -0.01em; }
  .brand__sub { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.22em; color: var(--brass); text-transform: uppercase; align-self: flex-start; margin-top: 0.15rem; }
  .nav { display: flex; align-items: center; gap: 0.35rem; margin-left: auto; }
  .nav a { position: relative; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); padding: 0.55rem 0.7rem; border-radius: var(--radius-pill); transition: color 0.25s var(--ease), background 0.25s var(--ease); }
  .nav a:hover { color: var(--bone); background: var(--ink-3); }
  .nav a.active { color: var(--bone); }
  @media (max-width: 720px) { .nav a.optional { display: none; } }

  .shell { flex: 1 1 auto; display: grid; grid-template-columns: minmax(280px, 360px) 1fr; min-height: 0; }
  @media (max-width: 760px) { .shell { grid-template-columns: 1fr; } .shell[data-view="thread"] .list { display: none; } .shell[data-view="list"] .thread { display: none; } }

  /* list pane */
  .list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .list__head { padding: 1.1rem var(--gutter-app) 0.6rem; }
  .list__title { font-family: var(--font-serif); font-weight: 400; font-size: 1.6rem; letter-spacing: -0.02em; }
  .list__scroll { overflow-y: auto; flex: 1 1 auto; padding-bottom: 1rem; }
  .group-label { font-family: var(--font-mono); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--bone-faint); padding: 1rem var(--gutter-app) 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
  .group-label .n { color: var(--brass); }
  .row { display: flex; gap: 0.8rem; align-items: center; padding: 0.75rem var(--gutter-app); cursor: pointer; border-left: 2px solid transparent; transition: background 0.2s var(--ease); width: 100%; text-align: left; background: none; border-top: 0; border-right: 0; border-bottom: 0; color: inherit; }
  .row:hover { background: var(--ink-2); }
  .row.active { background: var(--ink-2); border-left-color: var(--brass); }
  .row__main { flex: 1 1 auto; min-width: 0; }
  .row__top { display: flex; justify-content: space-between; gap: 0.5rem; align-items: baseline; }
  .row__name { font-family: var(--font-serif); font-weight: 460; font-size: 1.02rem; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row__time { font-family: var(--font-mono); font-size: 0.56rem; letter-spacing: 0.08em; color: var(--bone-faint); flex: 0 0 auto; }
  .row__prev { font-size: 0.82rem; color: var(--bone-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0.1rem; }
  .row__prev.req { color: var(--brass); }
  .row__unread { width: 8px; height: 8px; border-radius: 50%; background: var(--brass); flex: 0 0 auto; }

  /* thread pane */
  .thread { display: flex; flex-direction: column; min-height: 0; }
  .thread__head { flex: 0 0 auto; display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem var(--gutter-app); border-bottom: 1px solid var(--line); }
  .thread__back { display: none; }
  @media (max-width: 760px) { .thread__back { display: grid; } }
  .thread__id { flex: 1 1 auto; min-width: 0; }
  .thread__name { font-family: var(--font-serif); font-weight: 460; font-size: 1.15rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 0.4rem; }
  .thread__name .seal { color: var(--brass); }
  .thread__sub { font-family: var(--font-mono); font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bone-faint); margin-top: 0.15rem; }
  .thread__scroll { flex: 1 1 auto; overflow-y: auto; padding: 1.6rem var(--gutter-app); display: flex; flex-direction: column; gap: 0.6rem; }
  .daystamp { align-self: center; font-family: var(--font-mono); font-size: 0.56rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bone-faint); margin: 0.5rem 0; }
  .bubble { max-width: min(72%, 460px); padding: 0.7rem 0.95rem; border-radius: 16px; line-height: 1.45; font-size: 0.94rem; }
  .bubble.them { align-self: flex-start; background: var(--ink-2); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
  .bubble.me { align-self: flex-end; background: var(--bone); color: var(--ink); border-bottom-right-radius: 5px; }
  .bubble__time { display: block; margin-top: 0.35rem; font-family: var(--font-mono); font-size: 0.52rem; letter-spacing: 0.08em; opacity: 0.6; }

  .reqbar { flex: 0 0 auto; display: flex; align-items: center; gap: 0.8rem; padding: 0.9rem var(--gutter-app); border-top: 1px solid var(--line); background: linear-gradient(180deg, transparent, var(--ink-2)); flex-wrap: wrap; }
  .reqbar p { flex: 1 1 200px; font-size: 0.86rem; color: var(--bone-dim); }
  .reqbar p b { color: var(--bone); font-weight: 460; }
  .pending { flex: 0 0 auto; padding: 0.9rem var(--gutter-app); border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brass); display: flex; align-items: center; gap: 0.5rem; }

  .composer { flex: 0 0 auto; display: flex; gap: 0.6rem; align-items: flex-end; padding: 0.9rem var(--gutter-app) 1.1rem; border-top: 1px solid var(--line); }
  .composer textarea { flex: 1 1 auto; resize: none; min-height: 44px; max-height: 140px; font-family: var(--font-sans); font-size: 0.95rem; color: var(--bone); background: var(--ink-2); border: 1px solid var(--line); border-radius: 22px; padding: 0.65rem 1rem; line-height: 1.4; }
  .composer textarea:focus { outline: none; border-color: var(--brass); }

  .empty { flex: 1 1 auto; display: grid; place-items: center; text-align: center; padding: 2rem; }
  .empty__in { max-width: 34ch; }
  .empty h2 { font-family: var(--font-serif); font-weight: 360; font-size: 1.7rem; letter-spacing: -0.02em; margin: 1rem 0 0.5rem; }
  .empty p { color: var(--bone-dim); font-size: 0.92rem; line-height: 1.55; }

  .grain { position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0.045; mix-blend-mode: overlay; background-image: var(--grain-url); }
</style>
