<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0c0c0b" />
<title>Sign in — SecurityArts</title>
<script>try{var t=localStorage.getItem('sa-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="icon" href="../../assets/favicon.svg" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body { background: var(--ink); color: var(--bone); font-family: var(--font-sans); font-weight: 360; font-size: var(--fs-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; transition: background var(--dur-mid) var(--ease), color var(--dur-mid) var(--ease); }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--brass); color: var(--selection-fg, var(--ink)); }

  .top { display: flex; align-items: center; gap: 1rem; padding: 1.1rem var(--gutter-app); }
  .brand { display: inline-flex; align-items: center; gap: 0.6rem; }
  .brand svg { transition: transform 0.9s var(--ease); } .brand:hover svg { transform: rotate(22.5deg); }
  .brand__word { font-family: var(--font-serif); font-weight: 460; font-size: 1.28rem; letter-spacing: -0.01em; }
  .top__spacer { margin-left: auto; }

  main { flex: 1 1 auto; display: grid; place-items: center; padding: clamp(1.5rem, 4vw, 3rem) var(--gutter-app) clamp(3rem, 6vw, 5rem); }
  .auth { position: relative; width: 100%; max-width: 26rem; }
  .auth__bleed { position: absolute; top: -7rem; right: -9rem; width: 22rem; height: 22rem; color: rgba(244,241,233,0.05); pointer-events: none; z-index: 0; }
  [data-theme="light"] .auth__bleed { color: rgba(16,15,14,0.045); }
  .auth__in { position: relative; z-index: 1; }

  .auth__eyebrow { display: inline-flex; align-items: center; gap: 0.55rem; font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--brass); }
  .auth__eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brass); box-shadow: 0 0 0 4px var(--brass-glow); }
  .auth__title { font-family: var(--font-serif); font-optical-sizing: auto; font-weight: 340; font-size: clamp(2.2rem, 1rem+4vw, 3rem); line-height: 0.98; letter-spacing: -0.03em; margin: 1rem 0 0.4rem; text-wrap: balance; }
  .auth__title em { font-style: italic; color: var(--brass); }
  .auth__sub { color: var(--bone-dim); line-height: 1.55; max-width: 34ch; margin-bottom: 1.8rem; }

  .card { border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--ink-2); padding: clamp(1.4rem, 3vw, 2rem); }
  .field { margin-bottom: 1rem; }
  .field:last-of-type { margin-bottom: 0; }
  .authnote { min-height: 1.2rem; margin-top: 0.9rem; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.02em; }
  .authnote.err { color: var(--error); }
  .authnote.ok { color: var(--brass); }
  .submit { margin-top: 1.2rem; }

  .switch { margin-top: 1.4rem; font-size: 0.9rem; color: var(--bone-dim); text-align: center; }
  .switch button { background: none; border: 0; cursor: pointer; color: var(--brass); font: inherit; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
  .switch button:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 2px; }

  .fineprint { margin-top: 1.6rem; font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.06em; color: var(--bone-faint); text-align: center; line-height: 1.7; }
  .fineprint a { color: var(--bone-dim); }
  .fineprint a:hover { color: var(--bone); }

  .grain { position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0.045; mix-blend-mode: overlay; background-image: var(--grain-url); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 120s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
</style>
</head>
<body>
<div id="root"></div>
<div class="grain" aria-hidden="true"></div>
<script src="../../assets/vendor/react.production.min.js"></script>
<script src="../../assets/vendor/react-dom.production.min.js"></script>
<script src="../../assets/transition.js"></script>
<script src="../../../../js/api.js"></script>
<script src="../../assets/session.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../assets/failsafe.js"></script>
<script src="login.app.js" defer></script>
</body>
</html>
