<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify — SecurityArts</title>
<script>try{var t=localStorage.getItem('sa-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="icon" href="../../assets/favicon.svg" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--bone); font-family: var(--font-sans); font-weight: 360; font-size: var(--fs-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; transition: background var(--dur-mid) var(--ease), color var(--dur-mid) var(--ease); }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--brass); color: var(--selection-fg, var(--ink)); }

  .appbar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: clamp(0.7rem,2vw,1.5rem); padding: 0.85rem var(--gutter-app); background: color-mix(in srgb, var(--ink) 90%, transparent); backdrop-filter: blur(var(--blur-bar)); border-bottom: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 0.6rem; }
  .brand svg { transition: transform 0.9s var(--ease); } .brand:hover svg { transform: rotate(22.5deg); }
  .brand__word { font-family: var(--font-serif); font-weight: 460; font-size: 1.28rem; letter-spacing: -0.01em; }
  .brand__sub { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.22em; color: var(--brass); text-transform: uppercase; align-self: flex-start; margin-top: 0.15rem; }
  .nav { display: flex; align-items: center; gap: 0.35rem; margin-left: auto; }
  .nav a { position: relative; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); padding: 0.55rem 0.7rem; border-radius: var(--radius-pill); transition: color 0.25s var(--ease), background 0.25s var(--ease); }
  .nav a:hover { color: var(--bone); background: var(--ink-3); }
  .nav a.active { color: var(--bone); }
  .nav a .dot { position: absolute; top: 0.35rem; right: 0.35rem; width: 6px; height: 6px; border-radius: 50%; background: var(--brass); }
  @media (max-width: 760px) { .nav a.optional { display: none; } }

  .wrap { max-width: 1080px; margin-inline: auto; padding-inline: var(--gutter-app); }

  .hero { text-align: center; padding: clamp(2.6rem,6vw,5rem) 0 clamp(1.5rem,3vw,2.4rem); }
  .hero__eyebrow { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--brass); display: inline-flex; align-items: center; gap: 0.5rem; }
  .hero h1 { font-family: var(--font-serif); font-weight: 340; font-optical-sizing: auto; font-size: clamp(2.6rem,1rem+6vw,5rem); line-height: 0.95; letter-spacing: -0.035em; margin: 1rem 0; }
  .hero h1 em { font-style: italic; color: var(--brass); }
  .hero p { color: var(--bone-dim); max-width: 52ch; margin: 0 auto; font-size: var(--fs-lede); line-height: 1.55; }

  .checker { max-width: 620px; margin: clamp(1.6rem,3vw,2.4rem) auto 0; }
  .checkform { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .checkform > *:first-child { flex: 1 1 260px; }
  .samples { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 1rem; justify-content: center; }
  .samples .lbl { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--bone-faint); }

  /* trust steps (shown before a search) */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; margin: clamp(2.5rem,5vw,4rem) 0; }
  @media (max-width: 680px) { .steps { grid-template-columns: 1fr; } }
  .step { background: var(--ink); padding: 1.6rem 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .step__n { font-family: var(--font-mono); font-size: 0.7rem; letter-spacing: 0.14em; color: var(--brass); }
  .step__t { font-family: var(--font-serif); font-weight: 420; font-size: 1.25rem; letter-spacing: -0.01em; }
  .step__b { color: var(--bone-dim); font-size: 0.88rem; line-height: 1.55; }

  /* result */
  .result { margin: clamp(1.5rem,3vw,2.5rem) 0 1rem; display: grid; gap: clamp(1.2rem,2.5vw,2rem); grid-template-columns: 1fr; }
  @media (min-width: 860px) { .result { grid-template-columns: 0.9fr 1.1fr; align-items: start; } }
  .result__art { position: relative; border-radius: var(--radius-card); overflow: hidden; border: 1px solid var(--line); aspect-ratio: 4/5; background: var(--ink-2); }
  .result__art img { width: 100%; height: 100%; object-fit: cover; }
  .result__badge { position: absolute; top: 0.8rem; left: 0.8rem; }
  .result__cap { position: absolute; inset: auto 0 0 0; padding: 1.8rem 1rem 0.9rem; background: linear-gradient(to top, rgba(7,7,6,0.92), transparent); }
  .result__cap .t { font-family: var(--font-serif); font-weight: 460; font-size: 1.2rem; letter-spacing: -0.01em; color: #f4f1e9; }
  .result__cap .a { font-size: 0.82rem; color: #cfc9bb; margin-top: 0.15rem; }
  .verdict { display: flex; flex-direction: column; gap: 1.1rem; }
  .verdict__stamp { display: flex; align-items: center; gap: 1rem; }
  .verdict__seal { color: var(--brass); flex: 0 0 auto; }
  .verdict__title { font-family: var(--font-serif); font-weight: 360; font-size: clamp(1.7rem,1rem+2vw,2.4rem); letter-spacing: -0.02em; line-height: 1; }
  .verdict__sub { font-family: var(--font-mono); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--brass); margin-top: 0.4rem; }
  .artistrow { display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .artistrow__main { flex: 1 1 auto; min-width: 0; }
  .artistrow__name { font-family: var(--font-serif); font-weight: 440; font-size: 1.1rem; letter-spacing: -0.01em; }
  .artistrow__meta { font-family: var(--font-mono); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--bone-faint); margin-top: 0.15rem; }
  .verdict__actions { display: flex; gap: 0.7rem; flex-wrap: wrap; }

  .notfound { text-align: center; padding: clamp(2rem,4vw,3rem); border: 1px dashed var(--line-strong); border-radius: var(--radius-card); margin: clamp(1.5rem,3vw,2.5rem) 0; }
  .notfound h2 { font-family: var(--font-serif); font-weight: 360; font-size: clamp(1.5rem,1rem+2vw,2.1rem); letter-spacing: -0.02em; margin-bottom: 0.5rem; }
  .notfound p { color: var(--bone-dim); max-width: 40ch; margin: 0 auto; line-height: 1.55; }

  .foot { border-top: 1px solid var(--line); padding: 2.4rem var(--gutter-app); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; margin-top: 3rem; }
  .foot a { font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); }
  .foot a:hover { color: var(--bone); }
  .foot .m { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; color: var(--bone-faint); }

  .grain { position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0.045; mix-blend-mode: overlay; background-image: var(--grain-url); }
</style>
</head>
<body>
<div id="root"></div>
<div class="grain" aria-hidden="true"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../assets/catalog.js"></script>
<script src="../../assets/genart.js"></script>
<script src="../../assets/transition.js"></script>
<script src="../../../../js/api.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { Seal, Icon, Input, Button, Chip, Certificate, VerifiedBadge, Avatar, Toast, ThemeToggle } = window.SecurityArtsDesignSystem_f7e889;
const C = window.SACatalog;

/* Deterministic seal record per work (demo stand-in for the public registry). */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function strhash(s){var h=0;for(var i=0;i<s.length;i++)h=(Math.imul(31,h)+s.charCodeAt(i))|0;return h;}
function hex(seed,n){var r=mulberry(strhash(seed));var o="";for(var i=0;i<n;i++)o+="0123456789abcdef"[(r()*16)|0];return o;}
function sealId(id){return "SA-"+((strhash("seal"+id)>>>0).toString(36).toUpperCase()+"000000").slice(0,6);}
function sealDate(id){var d=new Date(2026,0,1+(Math.abs(strhash(id))%180));return d.toISOString().slice(0,10);}

const SEALS = C.works.map((w) => ({
  work: w, artist: C.artistById[w.artistId],
  id: sealId(w.id), hash: hex("h"+w.id, 64), sig: hex("s"+w.id, 96), signer: "sa:key:" + hex("k"+w.artistId, 12), ts: sealDate(w.id),
}));
const BY_ID = {}; SEALS.forEach((s) => { BY_ID[s.id] = s; });
const SAMPLES = [SEALS[3], SEALS[19], SEALS[13]].map((s) => s.id);
const money = (n) => "$" + n.toLocaleString("en-US");

function AppBar() {
  return (
    <header className="appbar">
      <a className="brand" href="index.html" aria-label="SecurityArts Discover">
        <Seal size={30} /><span className="brand__word">SecurityArts</span><span className="brand__sub">Verify</span>
      </a>
      <nav className="nav">
        <a href="index.html" className="optional">Discover</a>
        <a href="foryou.html" className="optional">For You</a>
        <a href="dms.html" className="optional">DMs</a>
        <a href="verify.html" className="active">Verify</a>
        <a href="me.html" className="optional">You</a>
        <ThemeToggle size={38} />
      </nav>
    </header>
  );
}

function App() {
  const [q, setQ] = React.useState("");
  const [result, setResult] = React.useState(undefined); // undefined = not searched, null = no match
  const [toast, setToast] = React.useState("");
  const toastRef = React.useRef();
  const show = (m) => { setToast(m); clearTimeout(toastRef.current); toastRef.current = setTimeout(() => setToast(""), 1900); };

  const run = (raw) => {
    const v = (raw != null ? raw : q).trim().toUpperCase();
    if (!v) return;
    let hit = BY_ID[v] || BY_ID[v.indexOf("SA-") === 0 ? v : "SA-" + v] || null;
    if (!hit) { // also allow matching by a hash prefix
      const low = v.toLowerCase();
      hit = SEALS.find((s) => s.hash.indexOf(low) === 0 && low.length >= 6) || null;
    }
    setResult(hit);
    show(hit ? "Seal verified — authentic" : "No seal matched");
  };
  const useSample = (id) => { setQ(id); run(id); };

  return (
    <React.Fragment>
      <AppBar />
      <div className="wrap">
        <section className="hero">
          <span className="hero__eyebrow"><Icon name="shieldCheck" size={14} /> Public authenticity check</span>
          <h1>Verify a <em>seal.</em></h1>
          <p>Every work on SecurityArts carries a cryptographic seal proving a human made it. Paste a seal ID to confirm provenance — no account, no catch.</p>

          <div className="checker">
            <form className="checkform" onSubmit={(e) => { e.preventDefault(); run(); }}>
              <Input shape="pill" icon="search" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Seal ID (e.g. SA-XXXXXX) or hash…" aria-label="Seal ID or hash" />
              <Button variant="solid" type="submit" arrow>Verify</Button>
            </form>
            <div className="samples">
              <span className="lbl">Try one:</span>
              {SAMPLES.map((id) => <Chip key={id} onClick={() => useSample(id)}>{id}</Chip>)}
            </div>
          </div>
        </section>

        {result === undefined ? (
          <section className="steps">
            <div className="step"><span className="step__n">01</span><span className="step__t">A human makes it</span><span className="step__b">An artist creates an original work — by hand, on canvas, in-camera, or in 3D.</span></div>
            <div className="step"><span className="step__n">02</span><span className="step__t">We seal it</span><span className="step__b">SecurityArts signs the work's fingerprint with its private key and posts the hash to a public registry.</span></div>
            <div className="step"><span className="step__n">03</span><span className="step__t">Anyone verifies</span><span className="step__b">Buyers, galleries, and platforms check the seal here — provenance without a middleman.</span></div>
          </section>
        ) : result === null ? (
          <div className="notfound">
            <Seal size={48} style={{ margin: "0 auto 1rem", color: "var(--bone-faint)" }} />
            <h2>No seal matched.</h2>
            <p>Check the ID and try again — or tap one of the sample seals above to see a verified result.</p>
          </div>
        ) : (
          <section className="result">
            <div className="result__art">
              <img src={SAGenArt.dataUri(result.work.seed, { cat: result.work.cat })} alt={result.work.title} />
              <VerifiedBadge className="result__badge">Verified</VerifiedBadge>
              <div className="result__cap"><div className="t">{result.work.title}</div><div className="a">{result.work.medium} · {money(result.work.price)}</div></div>
            </div>
            <div className="verdict">
              <div className="verdict__stamp">
                <Seal size={62} className="verdict__seal" />
                <div>
                  <div className="verdict__title">Authentic — <em style={{ fontStyle: "italic", color: "var(--brass)" }}>human-made.</em></div>
                  <div className="verdict__sub">Seal {result.id} · valid</div>
                </div>
              </div>
              <div className="artistrow">
                <Avatar name={result.artist.name} size={44} verified />
                <div className="artistrow__main">
                  <div className="artistrow__name">{result.artist.name}</div>
                  <div className="artistrow__meta">{result.artist.city} · verified artist</div>
                </div>
                <a href={`profile.html?artist=${result.artist.id}`}><Button variant="ghost" size="sm">View artist</Button></a>
              </div>
              <Certificate rows={[
                { k: "Seal ID", v: result.id, brass: true },
                { k: "Algorithm", v: "ECDSA P-256 · SHA-256" },
                { k: "Hash", v: result.hash.slice(0, 40) + "…" + result.hash.slice(-8) },
                { k: "Signature", v: result.sig.slice(0, 40) + "…" + result.sig.slice(-8) },
                { k: "Signer", v: result.signer },
                { k: "Sealed", v: result.ts },
              ]}>
                <div className="verdict__actions">
                  <a href={`seal.html?id=${result.id}`}><Button variant="brass" size="sm" arrow>View full record</Button></a>
                  <Button variant="ghost" size="sm" onClick={() => { setQ(""); setResult(undefined); }}>Verify another</Button>
                </div>
              </Certificate>
            </div>
          </section>
        )}
      </div>

      <footer className="foot">
        <a href="index.html">← Back to Discover</a>
        <span className="m">One seal · One human · Publicly verifiable</span>
      </footer>

      <Toast show={!!toast}>{toast}</Toast>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
