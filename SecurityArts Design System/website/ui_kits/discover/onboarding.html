<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Welcome — SecurityArts</title>
<script>try{var t=localStorage.getItem('sa-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="icon" href="../../assets/favicon.svg" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--bone); font-family: var(--font-sans); font-weight: 360; font-size: var(--fs-body); -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden; transition: background var(--dur-mid) var(--ease), color var(--dur-mid) var(--ease); }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--brass); color: var(--selection-fg, var(--ink)); }

  .shell { min-height: 100vh; display: flex; flex-direction: column; }
  .bar { display: flex; align-items: center; gap: 1rem; padding: 1.1rem var(--gutter-app); }
  .brand { display: inline-flex; align-items: center; gap: 0.6rem; }
  .brand svg { transition: transform 0.9s var(--ease); } .brand:hover svg { transform: rotate(22.5deg); }
  .brand__word { font-family: var(--font-serif); font-weight: 460; font-size: 1.28rem; letter-spacing: -0.01em; }
  .bar__right { margin-left: auto; display: flex; align-items: center; gap: 0.8rem; }
  .skip { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); transition: color 0.25s var(--ease); }
  .skip:hover { color: var(--bone); }

  /* progress rail */
  .rail { display: flex; gap: 0.5rem; padding: 0 var(--gutter-app) 0.4rem; max-width: 900px; margin-inline: auto; width: 100%; }
  .rail__seg { flex: 1; height: 3px; border-radius: 3px; background: var(--line-strong); overflow: hidden; }
  .rail__seg i { display: block; height: 100%; width: 0; background: var(--brass); transition: width 0.5s var(--ease); }
  .rail__seg.done i, .rail__seg.active i { width: 100%; }
  .rail__seg.active i { width: 50%; }

  .stage { flex: 1 1 auto; display: grid; place-items: center; padding: clamp(1.5rem,4vw,3.5rem) var(--gutter-app); }
  .card { width: 100%; max-width: 900px; }
  .step-eyebrow { font-family: var(--font-mono); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--brass); display: flex; align-items: center; gap: 0.5rem; }
  .step-title { font-family: var(--font-serif); font-weight: 340; font-optical-sizing: auto; font-size: clamp(2rem,1rem+3.4vw,3.4rem); line-height: 0.98; letter-spacing: -0.03em; margin: 0.9rem 0 0.7rem; }
  .step-title em { font-style: italic; color: var(--brass); }
  .step-sub { color: var(--bone-dim); font-size: var(--fs-lede); line-height: 1.55; max-width: 52ch; }
  .step-body { margin-top: clamp(1.6rem,3vw,2.4rem); }

  /* role cards */
  .roles { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .roles { grid-template-columns: 1fr 1fr; } }
  .role { text-align: left; cursor: pointer; background: var(--ink-2); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 1.5rem; display: flex; flex-direction: column; gap: 0.7rem; transition: border-color 0.25s var(--ease), background 0.25s var(--ease), transform 0.3s var(--ease); }
  .role:hover { border-color: var(--line-strong); transform: translateY(-3px); }
  .role.sel { border-color: var(--brass); background: linear-gradient(160deg, #19150d, var(--ink-2) 70%); }
  .role__seal { color: var(--bone-faint); } .role.sel .role__seal { color: var(--brass); }
  .role__t { font-family: var(--font-serif); font-weight: 420; font-size: 1.5rem; letter-spacing: -0.015em; }
  .role__b { color: var(--bone-dim); font-size: 0.92rem; line-height: 1.5; }

  /* medium chips */
  .chips { display: flex; flex-wrap: wrap; gap: 0.6rem; }
  .mchip { cursor: pointer; font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--bone-dim); background: none; border: 1px solid var(--line-strong); border-radius: var(--radius-pill); padding: 0.7rem 1.1rem; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s var(--ease); }
  .mchip:hover { color: var(--bone); border-color: var(--bone); }
  .mchip.sel { background: var(--brass); color: var(--ink); border-color: var(--brass); }
  .mchip .tick { width: 14px; height: 14px; display: grid; place-items: center; }

  /* artist suggestions */
  .sugg { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .scard { display: flex; align-items: center; gap: 0.8rem; border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--ink-2); padding: 0.9rem 1rem; transition: border-color 0.25s var(--ease); }
  .scard.sel { border-color: var(--brass); }
  .scard__main { flex: 1 1 auto; min-width: 0; }
  .scard__name { font-family: var(--font-serif); font-weight: 440; font-size: 1.05rem; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .scard__meta { font-family: var(--font-mono); font-size: 0.54rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--bone-faint); margin-top: 0.15rem; }
  .follow-btn { flex: 0 0 auto; cursor: pointer; font-family: var(--font-mono); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; border-radius: var(--radius-pill); padding: 0.45rem 0.75rem; border: 1px solid var(--line-strong); background: none; color: var(--bone-dim); transition: all 0.2s var(--ease); }
  .follow-btn:hover { color: var(--bone); border-color: var(--bone); }
  .follow-btn.on { background: var(--brass); color: var(--ink); border-color: var(--brass); }

  /* done */
  .done { text-align: center; }
  .done__seal { color: var(--brass); margin: 0 auto 1.4rem; }
  .done__summary { display: flex; gap: 2.2rem; justify-content: center; flex-wrap: wrap; margin: 1.6rem 0; }
  .ds { display: flex; flex-direction: column; gap: 0.2rem; }
  .ds b { font-family: var(--font-serif); font-weight: 440; font-size: 1.8rem; letter-spacing: -0.02em; }
  .ds span { font-family: var(--font-mono); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--bone-faint); }

  .foot { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.2rem var(--gutter-app) 1.8rem; max-width: 900px; margin-inline: auto; width: 100%; }
  .count { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bone-faint); }

  .grain { position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0.045; mix-blend-mode: overlay; background-image: var(--grain-url); }
</style>
</head>
