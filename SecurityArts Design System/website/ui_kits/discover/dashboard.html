<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Studio — SecurityArts</title>
<script>try{var t=localStorage.getItem('sa-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="icon" href="../../assets/favicon.svg" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--bone); font-family: var(--font-sans); font-weight: 360; font-size: var(--fs-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; transition: background var(--dur-mid) var(--ease), color var(--dur-mid) var(--ease); }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--brass); color: var(--selection-fg, var(--ink)); }

  .appbar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: clamp(0.7rem,2vw,1.5rem); padding: 0.85rem var(--gutter-app); background: color-mix(in srgb, var(--ink) 90%, transparent); backdrop-filter: blur(var(--blur-bar)); border-bottom: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 0.6rem; }
  .brand svg { transition: transform 0.9s var(--ease); } .brand:hover svg { transform: rotate(22.5deg); }
  .brand__word { font-family: var(--font-serif); font-weight: 460; font-size: 1.28rem; letter-spacing: -0.01em; }
  .brand__sub { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.22em; color: var(--brass); text-transform: uppercase; align-self: flex-start; margin-top: 0.15rem; }
  .nav { display: flex; align-items: center; gap: 0.35rem; margin-left: auto; }
  .nav a { position: relative; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); padding: 0.55rem 0.7rem; border-radius: var(--radius-pill); transition: color 0.25s var(--ease), background 0.25s var(--ease); }
  .nav a:hover { color: var(--bone); background: var(--ink-3); }
  .nav a.active { color: var(--bone); }
  .nav a .dot { position: absolute; top: 0.35rem; right: 0.35rem; width: 6px; height: 6px; border-radius: 50%; background: var(--brass); }
  @media (max-width: 820px) { .nav a.optional { display: none; } }

  .wrap { max-width: 1180px; margin-inline: auto; padding-inline: var(--gutter-app); }

  .dhead { display: flex; align-items: center; gap: clamp(1rem,2.5vw,1.6rem); flex-wrap: wrap; padding: clamp(1.8rem,4vw,3rem) 0 clamp(1.2rem,2.5vw,1.8rem); }
  .dhead__id { flex: 1 1 320px; }
  .dhead__eyebrow { font-family: var(--font-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.18em; color: var(--brass); }
  .dhead__name { font-family: var(--font-serif); font-weight: 400; font-size: clamp(1.8rem,1rem+2.4vw,2.8rem); letter-spacing: -0.025em; line-height: 1; display: flex; align-items: center; gap: 0.55rem; margin-top: 0.5rem; }
  .dhead__name .seal { color: var(--brass); }
  .dhead__meta { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; color: var(--bone-dim); margin-top: 0.5rem; display: flex; gap: 0.9rem; flex-wrap: wrap; }
  .dhead__meta .m { display: inline-flex; align-items: center; gap: 0.3rem; }
  .dhead__actions { display: flex; gap: 0.6rem; align-items: center; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; margin-bottom: clamp(1.5rem,3vw,2.4rem); }
  @media (max-width: 720px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--ink-2); padding: 1.2rem 1.3rem; display: flex; flex-direction: column; gap: 0.35rem; }
  .kpi b { font-family: var(--font-serif); font-weight: 440; font-size: clamp(1.6rem,1rem+1.5vw,2.2rem); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .kpi span { font-family: var(--font-mono); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--bone-faint); }
  .kpi.accent b { color: var(--brass); }

  .tabs { display: flex; gap: 0.4rem; border-bottom: 1px solid var(--line); margin-bottom: 1.6rem; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); background: none; border: 0; cursor: pointer; padding: 0.7rem 0.5rem; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; transition: color 0.25s var(--ease), border-color 0.25s var(--ease); display: inline-flex; align-items: center; gap: 0.4rem; }
  .tab:hover { color: var(--bone); }
  .tab.active { color: var(--bone); border-bottom-color: var(--brass); }
  .tab .pill { font-size: 0.56rem; background: var(--brass); color: var(--ink); border-radius: 100px; padding: 0.1rem 0.4rem; letter-spacing: 0.08em; }

  /* works grid */
  .works { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
  .wcard { border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; background: var(--ink-2); transition: border-color 0.25s var(--ease), transform 0.3s var(--ease); }
  .wcard:hover { border-color: var(--line-strong); transform: translateY(-3px); }
  .wcard__art { position: relative; aspect-ratio: 4/5; overflow: hidden; }
  .wcard__art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .wcard__badge { position: absolute; top: 0.6rem; left: 0.6rem; }
  .wcard__info { padding: 0.85rem 0.9rem 1rem; }
  .wcard__title { font-family: var(--font-serif); font-weight: 440; font-size: 1.05rem; letter-spacing: -0.01em; }
  .wcard__row { display: flex; justify-content: space-between; align-items: baseline; margin-top: 0.3rem; }
  .wcard__price { font-family: var(--font-mono); font-size: 0.8rem; color: var(--brass); }
  .wcard__stat { font-family: var(--font-mono); font-size: 0.56rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--bone-faint); }
  .newwork { border: 1.5px dashed var(--line-strong); border-radius: var(--radius-card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.7rem; text-align: center; padding: 1.5rem; cursor: pointer; color: var(--bone-dim); transition: border-color 0.25s var(--ease), color 0.25s var(--ease); min-height: 220px; }
  .newwork:hover { border-color: var(--brass); color: var(--bone); }
  .newwork span { font-family: var(--font-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.12em; }

  /* generic rows table */
  .rows { border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; }
  .row { display: flex; align-items: center; gap: 1rem; padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--ink-2); }
  .row__thumb { width: 40px; height: 50px; border-radius: var(--radius-sm); overflow: hidden; flex: 0 0 auto; background: var(--ink); }
  .row__thumb img { width: 100%; height: 100%; object-fit: cover; }
  .row__main { flex: 1 1 auto; min-width: 0; }
  .row__title { font-family: var(--font-serif); font-weight: 440; font-size: 1.02rem; letter-spacing: -0.01em; }
  .row__sub { font-family: var(--font-mono); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--bone-faint); margin-top: 0.15rem; }
  .row__buyer { display: flex; align-items: center; gap: 0.55rem; font-size: 0.86rem; color: var(--bone-dim); min-width: 0; }
  .row__amt { font-family: var(--font-mono); font-size: 0.85rem; color: var(--brass); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row__date { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.08em; color: var(--bone-faint); white-space: nowrap; }
  @media (max-width: 620px) { .row__date, .row__sub { display: none; } }
  .req__actions { display: flex; gap: 0.5rem; flex: 0 0 auto; }

  /* payouts */
  .paywrap { display: grid; gap: 1.4rem; grid-template-columns: 1fr; }
  @media (min-width: 780px) { .paywrap { grid-template-columns: 340px 1fr; align-items: start; } }
  .balance { border: 1px solid var(--brass); border-radius: var(--radius-card); background: linear-gradient(160deg, #19150d, var(--ink-2) 70%); padding: 1.5rem; }
  .balance__k { font-family: var(--font-mono); font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--brass); }
  .balance__v { font-family: var(--font-serif); font-weight: 400; font-size: clamp(2.4rem,1rem+3vw,3.4rem); letter-spacing: -0.03em; margin: 0.3rem 0 0.2rem; font-variant-numeric: tabular-nums; }
  .balance__note { font-size: 0.8rem; color: var(--bone-dim); margin-bottom: 1.2rem; }

  .empty { text-align: center; padding: 3rem 1rem; color: var(--bone-dim); }
  .empty h2 { font-family: var(--font-serif); font-weight: 360; font-size: 1.6rem; letter-spacing: -0.02em; color: var(--bone); margin-bottom: 0.5rem; }

  .foot { border-top: 1px solid var(--line); padding: 2.4rem var(--gutter-app); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; margin-top: 3rem; }
  .foot a { font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); }
  .foot a:hover { color: var(--bone); }
  .foot .m { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; color: var(--bone-faint); }

  .grain { position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0.045; mix-blend-mode: overlay; background-image: var(--grain-url); }
</style>
</head>
<body>
<div id="root"></div>
<div class="grain" aria-hidden="true"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../assets/catalog.js"></script>
<script src="../../assets/store.js"></script>
<script src="../../assets/genart.js"></script>
<script src="../../assets/transition.js"></script>
<script src="../../../../js/api.js"></script>
<script src="../../_ds_bundle.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel">
const { Seal, Icon, IconButton, Button, Avatar, VerifiedBadge, Toast, ThemeToggle } = window.SecurityArtsDesignSystem_f7e889;
const C = window.SACatalog, S = window.SAStore;

function useStoreTick() { const [, set] = React.useState(0); React.useEffect(() => S.subscribe(() => set((n) => n + 1)), []); }
function money(n) { return "$" + n.toLocaleString("en-US"); }
function strhash(s){var h=0;for(var i=0;i<s.length;i++)h=(Math.imul(31,h)+s.charCodeAt(i))|0;return h;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

const BUYERS = ["Aria Fenn", "Marcus Lowe", "Studio Kite", "Devon Park", "Lena Cho", "Atlas & Co.", "Nadia Rios", "Owen Frost", "Juno Ba", "Halcyon Gallery"];
const TIERS = ["Personal", "Commercial", "Exclusive"];
const TIER_MULT = { Personal: 1, Commercial: 3, Exclusive: 9 };

function qsArtist() {
  const id = new URLSearchParams(location.search).get("artist");
  return C.artistById[id] ? id : C.artists[0].id;
}

/* deterministic sales for an artist, derived from their works */
function salesFor(artistId) {
  const works = C.worksByArtist[artistId] || [];
  const rand = mulberry(Math.abs(strhash("sales" + artistId)) + 1);
  const out = [];
  works.forEach((w, wi) => {
    const n = 1 + Math.floor(rand() * 3);
    for (let i = 0; i < n; i++) {
      const tier = TIERS[Math.floor(rand() * TIERS.length)];
      const amt = w.price * TIER_MULT[tier];
      const daysAgo = 2 + Math.floor(rand() * 120);
      out.push({ id: w.id + "-" + i, work: w, buyer: BUYERS[Math.floor(rand() * BUYERS.length)], tier, amt, daysAgo });
    }
  });
  return out.sort((a, b) => a.daysAgo - b.daysAgo);
}
function dateAgo(days) { const d = new Date(Date.now() - days * 864e5); return d.toLocaleDateString("en-US", { month: "short", day: "numeric" }); }

function AppBar() {
  const pending = S.counts().pending;
  return (
    <header className="appbar">
      <a className="brand" href="index.html" aria-label="SecurityArts Discover">
        <Seal size={30} /><span className="brand__word">SecurityArts</span><span className="brand__sub">Studio</span>
      </a>
      <nav className="nav">
        <a href="index.html" className="optional">Discover</a>
        <a href="foryou.html" className="optional">For You</a>
        <a href="me.html" className="optional">You</a>
        <a href="dms.html">DMs{pending ? <span className="dot" /> : null}</a>
        <a href="verify.html" className="optional">Verify</a>
        <ThemeToggle size={38} />
      </nav>
    </header>
  );
}

function App() {
  useStoreTick();
  const [artistId] = React.useState(qsArtist);
  const artist = C.artistById[artistId];
  const works = C.worksByArtist[artistId] || [];
  const sales = React.useMemo(() => salesFor(artistId), [artistId]);
  const [tab, setTab] = React.useState("works");
  const [toast, setToast] = React.useState("");
  const toastRef = React.useRef();
  const show = (m) => { setToast(m); clearTimeout(toastRef.current); toastRef.current = setTimeout(() => setToast(""), 1900); };

  const totalSales = sales.reduce((s, x) => s + x.amt, 0);
  const requests = S.threadList().filter((t) => t.status === "incoming");
  const pending = requests.length;

  // payouts: 90% of sales to artist (10% marketplace fee), split into a few deterministic payout rows
  const earned = Math.round(totalSales * 0.9);
  const balance = Math.round(earned * 0.18);
  const payouts = React.useMemo(() => {
    const rand = mulberry(Math.abs(strhash("pay" + artistId)) + 5);
    const rows = []; let remaining = earned - balance;
    for (let i = 0; i < 4 && remaining > 0; i++) {
      const amt = i === 3 ? remaining : Math.round(remaining * (0.28 + rand() * 0.22));
      remaining -= amt;
      rows.push({ id: "po" + i, amt, daysAgo: 12 + i * 30 + Math.floor(rand() * 8), method: rand() > 0.5 ? "Bank ••4471" : "PayPal" });
    }
    return rows;
  }, [artistId, earned, balance]);

  return (
    <React.Fragment>
      <AppBar />
      <div className="wrap">
        <div className="dhead">
          <Avatar name={artist.name} size={92} verified />
          <div className="dhead__id">
            <p className="dhead__eyebrow">Artist studio</p>
            <h1 className="dhead__name">{artist.name}<Seal size={20} className="seal" title="Verified artist" /></h1>
            <div className="dhead__meta">
              <span className="m"><Icon name="mapPin" size={13} /> {artist.city}</span>
              <span className="m"><Icon name="shieldCheck" size={13} /> Verified · @{artist.handle}</span>
            </div>
          </div>
          <div className="dhead__actions">
            <a href={`profile.html?artist=${artist.id}`}><Button variant="ghost" size="sm">View public profile</Button></a>
            <Button variant="solid" size="sm" arrow onClick={() => show("Verify flow — seal a new work")}>New work</Button>
          </div>
        </div>

        <div className="kpis">
          <div className="kpi"><b>{works.length}</b><span>Sealed works</span></div>
          <div className="kpi accent"><b>{money(totalSales)}</b><span>Gross sales</span></div>
          <div className="kpi"><b>{artist.followers.toLocaleString()}</b><span>Followers</span></div>
          <div className="kpi"><b>{pending}</b><span>Requests</span></div>
        </div>

        <div className="tabs">
          <button className={`tab ${tab === "works" ? "active" : ""}`} onClick={() => setTab("works")}>Works</button>
          <button className={`tab ${tab === "sales" ? "active" : ""}`} onClick={() => setTab("sales")}>Sales · {sales.length}</button>
          <button className={`tab ${tab === "requests" ? "active" : ""}`} onClick={() => setTab("requests")}>Requests {pending ? <span className="pill">{pending}</span> : null}</button>
          <button className={`tab ${tab === "payouts" ? "active" : ""}`} onClick={() => setTab("payouts")}>Payouts</button>
        </div>

        {tab === "works" ? (
          <div className="works">
            {works.map((w) => (
              <div className="wcard" key={w.id}>
                <div className="wcard__art">
                  <img src={SAGenArt.dataUri(w.seed, { cat: w.cat })} alt={w.title} />
                  <VerifiedBadge className="wcard__badge">Sealed</VerifiedBadge>
                </div>
                <div className="wcard__info">
                  <div className="wcard__title">{w.title}</div>
                  <div className="wcard__row"><span className="wcard__price">{money(w.price)}</span><span className="wcard__stat">{sales.filter((s) => s.work.id === w.id).length} sold</span></div>
                </div>
              </div>
            ))}
            <div className="newwork" onClick={() => show("Verify flow — seal a new work")}>
              <Seal size={40} /><span>+ Seal a new work</span>
            </div>
          </div>
        ) : null}

        {tab === "sales" ? (
          <div className="rows">
            {sales.map((s) => (
              <div className="row" key={s.id}>
                <div className="row__thumb"><img src={SAGenArt.dataUri(s.work.seed, { cat: s.work.cat })} alt="" /></div>
                <div className="row__main">
                  <div className="row__title">{s.work.title}</div>
                  <div className="row__sub">{s.tier} license</div>
                </div>
                <div className="row__buyer"><Avatar name={s.buyer} size={28} /><span>{s.buyer}</span></div>
                <div className="row__amt">{money(s.amt)}</div>
                <div className="row__date">{dateAgo(s.daysAgo)}</div>
              </div>
            ))}
          </div>
        ) : null}

        {tab === "requests" ? (
          requests.length ? (
            <div className="rows">
              {requests.map((t) => {
                const a = C.artistById[t.artistId] || { name: "A collector", city: "" };
                return (
                  <div className="row" key={t.artistId}>
                    <Avatar name={a.name} size={40} />
                    <div className="row__main">
                      <div className="row__title">{a.name}</div>
                      <div className="row__sub" style={{ textTransform: "none", letterSpacing: 0, fontFamily: "var(--font-sans)", fontSize: "0.84rem", color: "var(--bone-dim)" }}>{t.last ? t.last.text : "Wants to connect"}</div>
                    </div>
                    <div className="req__actions">
                      <Button variant="solid" size="sm" onClick={() => { S.accept(t.artistId); show("Request accepted"); }}>Accept</Button>
                      <Button variant="ghost" size="sm" onClick={() => { S.decline(t.artistId); show("Request declined"); }}>Decline</Button>
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            <div className="empty"><Seal size={48} style={{ margin: "0 auto 1rem", color: "var(--bone-faint)" }} /><h2>No pending requests.</h2><p>New message requests from collectors land here.</p></div>
          )
        ) : null}

        {tab === "payouts" ? (
          <div className="paywrap">
            <div className="balance">
              <p className="balance__k">Available balance</p>
              <p className="balance__v">{money(balance)}</p>
              <p className="balance__note">90% of every sale is yours — a flat 10% marketplace fee, nothing else. Payouts settle to your linked account within 2 business days.</p>
              <Button variant="brass" size="sm" arrow onClick={() => show("Payout requested — settling to Bank ••4471")}>Withdraw</Button>
            </div>
            <div>
              <p style={{ fontFamily: "var(--font-mono)", fontSize: "0.6rem", textTransform: "uppercase", letterSpacing: "0.14em", color: "var(--bone-faint)", marginBottom: "0.7rem" }}>Recent payouts · lifetime earned {money(earned)}</p>
              <div className="rows">
                {payouts.map((p) => (
                  <div className="row" key={p.id}>
                    <div style={{ width: 40, height: 40, borderRadius: "50%", background: "var(--ink-3)", display: "grid", placeItems: "center", flex: "0 0 auto" }}><Icon name="check" size={16} /></div>
                    <div className="row__main">
                      <div className="row__title" style={{ fontFamily: "var(--font-mono)", fontSize: "0.85rem", letterSpacing: "0.04em" }}>{money(p.amt)}</div>
                      <div className="row__sub">Paid · {p.method}</div>
                    </div>
                    <div className="row__date">{dateAgo(p.daysAgo)}</div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        ) : null}
      </div>

      <footer className="foot">
        <a href="index.html">← Back to Discover</a>
        <a href="pricing.html" style={{ fontFamily: "var(--font-mono)", fontSize: "0.74rem", textTransform: "uppercase", letterSpacing: "0.12em", color: "var(--bone-dim)" }}>Pricing &amp; fees →</a>
        <span className="m">Your studio · 90% to the artist · Every work sealed</span>
      </footer>

      <Toast show={!!toast}>{toast}</Toast>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
