<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You — SecurityArts</title>
<script>try{var t=localStorage.getItem('sa-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="icon" href="../../assets/favicon.svg" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--bone); font-family: var(--font-sans); font-weight: 360; font-size: var(--fs-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; transition: background var(--dur-mid) var(--ease), color var(--dur-mid) var(--ease); }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--brass); color: var(--selection-fg, var(--ink)); }

  .appbar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: clamp(0.7rem,2vw,1.5rem); padding: 0.85rem var(--gutter-app); background: color-mix(in srgb, var(--ink) 90%, transparent); backdrop-filter: blur(var(--blur-bar)); border-bottom: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 0.6rem; }
  .brand svg { transition: transform 0.9s var(--ease); } .brand:hover svg { transform: rotate(22.5deg); }
  .brand__word { font-family: var(--font-serif); font-weight: 460; font-size: 1.28rem; letter-spacing: -0.01em; }
  .brand__sub { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.22em; color: var(--brass); text-transform: uppercase; align-self: flex-start; margin-top: 0.15rem; }
  .nav { display: flex; align-items: center; gap: 0.35rem; margin-left: auto; }
  .nav a { position: relative; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); padding: 0.55rem 0.7rem; border-radius: var(--radius-pill); transition: color 0.25s var(--ease), background 0.25s var(--ease); }
  .nav a:hover { color: var(--bone); background: var(--ink-3); }
  .nav a.active { color: var(--bone); }
  .nav a .dot { position: absolute; top: 0.35rem; right: 0.35rem; width: 6px; height: 6px; border-radius: 50%; background: var(--brass); }
  @media (max-width: 820px) { .nav a.optional { display: none; } }

  .wrap { max-width: 1180px; margin-inline: auto; padding-inline: var(--gutter-app); }

  .mehead { display: flex; align-items: center; gap: clamp(1rem,2.5vw,1.8rem); flex-wrap: wrap; padding: clamp(2rem,4vw,3.2rem) 0 clamp(1.2rem,2.5vw,1.8rem); }
  .mehead__avatar { border-radius: 50%; box-shadow: 0 0 0 5px var(--ink), 0 0 0 6px var(--line-strong); }
  .mehead__id { flex: 1 1 300px; }
  .mehead__eyebrow { font-family: var(--font-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.18em; color: var(--brass); }
  .mehead__name { font-family: var(--font-serif); font-weight: 400; font-size: clamp(2rem,1rem+2.6vw,3rem); letter-spacing: -0.03em; line-height: 1; margin-top: 0.45rem; }
  .mehead__handle { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.08em; color: var(--bone-dim); margin-top: 0.5rem; display: flex; gap: 0.9rem; flex-wrap: wrap; }
  .mehead__handle .m { display: inline-flex; align-items: center; gap: 0.3rem; }
  .mehead__actions { display: flex; gap: 0.6rem; align-items: center; }

  .stats { display: flex; gap: 2.2rem; padding: 1.1rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: clamp(1.5rem,3vw,2.2rem); }
  .stat { display: flex; flex-direction: column; gap: 0.2rem; cursor: pointer; }
  .stat b { font-family: var(--font-serif); font-weight: 440; font-size: clamp(1.4rem,1rem+1.2vw,1.9rem); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat span { font-family: var(--font-mono); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--bone-faint); }
  .stat.active b { color: var(--brass); }

  .tabs { display: flex; gap: 0.4rem; border-bottom: 1px solid var(--line); margin-bottom: 1.6rem; }
  .tab { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); background: none; border: 0; cursor: pointer; padding: 0.7rem 0.5rem; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.25s var(--ease), border-color 0.25s var(--ease); }
  .tab:hover { color: var(--bone); }
  .tab.active { color: var(--bone); border-bottom-color: var(--brass); }

  .masonry { column-width: 240px; column-gap: 16px; }
  .masonry .pinlink { display: block; break-inside: avoid; margin: 0 0 16px; }
  .masonry .sa-pin { margin: 0; }
  @media (max-width: 520px) { .masonry { column-width: 160px; column-gap: 12px; } .masonry .pinlink { margin-bottom: 12px; } }

  /* following list */
  .follows { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .fcard { display: flex; align-items: center; gap: 0.85rem; padding: 1rem 1.1rem; border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--ink-2); transition: border-color 0.25s var(--ease); }
  .fcard:hover { border-color: var(--line-strong); }
  .fcard__main { flex: 1 1 auto; min-width: 0; }
  .fcard__name { font-family: var(--font-serif); font-weight: 440; font-size: 1.1rem; letter-spacing: -0.01em; }
  .fcard__meta { font-family: var(--font-mono); font-size: 0.56rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--bone-faint); margin-top: 0.15rem; }

  /* purchases */
  .buys { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .bcard { border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; background: var(--ink-2); }
  .bcard__art { position: relative; aspect-ratio: 16/10; overflow: hidden; }
  .bcard__art img { width: 100%; height: 100%; object-fit: cover; }
  .bcard__badge { position: absolute; top: 0.6rem; left: 0.6rem; }
  .bcard__info { padding: 0.9rem 1rem 1.1rem; }
  .bcard__title { font-family: var(--font-serif); font-weight: 440; font-size: 1.1rem; letter-spacing: -0.01em; }
  .bcard__sub { font-size: 0.82rem; color: var(--bone-dim); margin-top: 0.15rem; }
  .bcard__seal { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid var(--line); font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--brass); transition: opacity 0.25s var(--ease); }
  .bcard__seal:hover { opacity: 0.7; }pacing: 0.1em; text-transform: uppercase; color: var(--brass); }

  .empty { text-align: center; padding: clamp(2.5rem,6vw,5rem) 1rem; }
  .empty h2 { font-family: var(--font-serif); font-weight: 360; font-size: clamp(1.7rem,1rem+2vw,2.4rem); letter-spacing: -0.025em; margin-bottom: 0.6rem; }
  .empty p { color: var(--bone-dim); max-width: 42ch; margin: 0 auto 1.4rem; line-height: 1.55; }

  .foot { border-top: 1px solid var(--line); padding: 2.4rem var(--gutter-app); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; margin-top: 3rem; }
  .foot a { font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); }
  .foot a:hover { color: var(--bone); }
  .foot .m { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; color: var(--bone-faint); }

  .grain { position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0.045; mix-blend-mode: overlay; background-image: var(--grain-url); }
</style>
