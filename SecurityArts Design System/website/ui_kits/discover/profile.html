<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Artist — SecurityArts</title>
<script>try{var t=localStorage.getItem('sa-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="icon" href="../../assets/favicon.svg" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--bone); font-family: var(--font-sans); font-weight: 360; font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; transition: background var(--dur-mid) var(--ease), color var(--dur-mid) var(--ease); }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--brass); color: var(--selection-fg, var(--ink)); }

  /* app bar (shared pattern across platform pages) */
  .appbar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: clamp(0.7rem,2vw,1.5rem); padding: 0.85rem var(--gutter-app); background: color-mix(in srgb, var(--ink) 90%, transparent); backdrop-filter: blur(var(--blur-bar)); border-bottom: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 0.6rem; flex: 0 0 auto; }
  .brand svg { transition: transform 0.9s var(--ease); }
  .brand:hover svg { transform: rotate(22.5deg); }
  .brand__word { font-family: var(--font-serif); font-weight: 460; font-size: 1.28rem; letter-spacing: -0.01em; }
  .brand__sub { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.22em; color: var(--brass); text-transform: uppercase; align-self: flex-start; margin-top: 0.15rem; }
  .nav { display: flex; align-items: center; gap: 0.35rem; margin-left: auto; }
  .nav a { position: relative; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); padding: 0.55rem 0.7rem; border-radius: var(--radius-pill); transition: color 0.25s var(--ease), background 0.25s var(--ease); }
  .nav a:hover { color: var(--bone); background: var(--ink-3); }
  .nav a.active { color: var(--bone); }
  .nav a .dot { position: absolute; top: 0.35rem; right: 0.35rem; width: 6px; height: 6px; border-radius: 50%; background: var(--brass); }
  @media (max-width: 720px) { .nav a.optional { display: none; } }

  .wrap { max-width: 1180px; margin-inline: auto; padding-inline: var(--gutter-app); }

  /* hero */
  .cover { position: relative; height: clamp(150px, 22vw, 260px); overflow: hidden; background: var(--ink-2); border-bottom: 1px solid var(--line); }
  .cover img { width: 100%; height: 100%; object-fit: cover; filter: saturate(0.9); }
  .cover::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 30%, var(--ink) 98%); }
  .phead { position: relative; margin-top: clamp(-70px, -7vw, -56px); display: flex; gap: clamp(1rem,2.5vw,1.8rem); align-items: flex-end; flex-wrap: wrap; }
  .phead__avatar { box-shadow: 0 0 0 5px var(--ink); border-radius: 50%; }
  .phead__id { flex: 1 1 320px; padding-bottom: 0.3rem; }
  .phead__name { font-family: var(--font-serif); font-weight: 400; font-size: clamp(1.8rem,1rem+2.6vw,2.9rem); letter-spacing: -0.025em; line-height: 1; display: flex; align-items: center; gap: 0.6rem; }
  .phead__name .seal { color: var(--brass); }
  .phead__handle { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.08em; color: var(--bone-dim); margin-top: 0.5rem; display: flex; gap: 0.9rem; flex-wrap: wrap; align-items: center; }
  .phead__handle .loc { display: inline-flex; align-items: center; gap: 0.3rem; }
  .phead__actions { display: flex; gap: 0.6rem; align-items: center; padding-bottom: 0.4rem; }

  .pbody { display: grid; gap: clamp(1.5rem,3vw,2.5rem); grid-template-columns: 1fr; margin-top: 1.8rem; }
  @media (min-width: 900px) { .pbody { grid-template-columns: 300px 1fr; align-items: start; } }
  .aside { display: flex; flex-direction: column; gap: 1.4rem; }
  @media (min-width: 900px) { .aside { position: sticky; top: 84px; } }
  .bio { color: var(--bone-dim); font-size: 0.98rem; line-height: 1.6; }
  .tags { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  .stats { display: flex; gap: 1.4rem; padding: 1rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .stat { display: flex; flex-direction: column; gap: 0.15rem; }
  .stat b { font-family: var(--font-serif); font-weight: 440; font-size: 1.4rem; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .stat span { font-family: var(--font-mono); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--bone-faint); }

  .tabs { display: flex; gap: 0.4rem; border-bottom: 1px solid var(--line); margin-bottom: 1.4rem; }
  .tab { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); background: none; border: 0; cursor: pointer; padding: 0.7rem 0.5rem; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.25s var(--ease), border-color 0.25s var(--ease); }
  .tab:hover { color: var(--bone); }
  .tab.active { color: var(--bone); border-bottom-color: var(--brass); }

  .masonry { column-width: 240px; column-gap: 16px; }
  .masonry .sa-pin { margin: 0 0 16px; }
  @media (max-width: 520px) { .masonry { column-width: 160px; column-gap: 12px; } .masonry .sa-pin { margin-bottom: 12px; } }
  .about { color: var(--bone-dim); line-height: 1.7; max-width: 60ch; }
  .about p { margin-bottom: 1rem; }
  .empty { padding: 3rem 0; color: var(--bone-dim); }

  /* DM request modal */
  .dm { padding: clamp(1.4rem,3vw,2rem); }
  .dm__eyebrow { font-family: var(--font-mono); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--brass); }
  .dm__title { font-family: var(--font-serif); font-weight: 360; font-size: clamp(1.6rem,1rem+2vw,2.2rem); letter-spacing: -0.02em; margin: 0.4rem 0 0.3rem; }
  .dm__who { display: flex; align-items: center; gap: 0.7rem; margin: 1rem 0; padding: 0.7rem 0.9rem; border: 1px solid var(--line); border-radius: var(--radius-lg); }
  .dm__who b { font-family: var(--font-serif); font-weight: 440; }
  .dm__who span { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; color: var(--bone-faint); text-transform: uppercase; }
  .dm textarea { width: 100%; min-height: 96px; resize: vertical; font-family: var(--font-sans); font-size: 0.95rem; color: var(--bone); background: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 0.8rem 0.9rem; line-height: 1.5; }
  .dm textarea:focus { outline: none; border-color: var(--brass); }
  .dm__note { font-size: 0.74rem; color: var(--bone-faint); line-height: 1.5; margin-top: 0.9rem; }
  .dm__actions { display: flex; gap: 0.7rem; margin-top: 1.2rem; flex-wrap: wrap; }

  .foot { border-top: 1px solid var(--line); padding: 2.4rem var(--gutter-app); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; margin-top: 3rem; }
  .foot a { font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); }
  .foot a:hover { color: var(--bone); }
  .foot .m { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; color: var(--bone-faint); }

  .grain { position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0.045; mix-blend-mode: overlay; background-image: var(--grain-url); }
</style>
</head>
