<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { background: var(--ink); color: var(--bone); font-family: var(--font-sans); font-weight: 360; font-size: var(--fs-body); line-height: var(--lh-relaxed); -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background var(--dur-mid) var(--ease), color var(--dur-mid) var(--ease); }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--brass); color: var(--selection-fg, var(--ink)); }

  .wrap { max-width: 1120px; margin-inline: auto; padding-inline: var(--gutter-app); }

  .appbar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: clamp(0.7rem,2vw,1.5rem); padding: 0.85rem var(--gutter-app); background: color-mix(in srgb, var(--ink) 90%, transparent); backdrop-filter: blur(var(--blur-bar)); border-bottom: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 0.6rem; }
  .brand svg { transition: transform 0.9s var(--ease); } .brand:hover svg { transform: rotate(22.5deg); }
  .brand__word { font-family: var(--font-serif); font-weight: 460; font-size: 1.28rem; letter-spacing: -0.01em; }
  .brand__sub { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.22em; color: var(--brass); text-transform: uppercase; align-self: flex-start; margin-top: 0.15rem; }
  .nav { display: flex; align-items: center; gap: 0.35rem; margin-left: auto; }
  .nav a { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); padding: 0.55rem 0.7rem; border-radius: var(--radius-pill); transition: color 0.25s var(--ease), background 0.25s var(--ease); }
  .nav a:hover { color: var(--bone); background: var(--ink-3); }
  .nav a.active { color: var(--bone); }
  @media (max-width: 760px) { .nav a.optional { display: none; } }

  .hero { text-align: center; padding: clamp(2.6rem,6vw,5rem) 0 clamp(1.5rem,3vw,2.2rem); }
  .hero__eyebrow { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--brass); display: inline-flex; align-items: center; gap: 0.5rem; }
  .hero h1 { font-family: var(--font-serif); font-weight: 340; font-optical-sizing: auto; font-size: clamp(2.6rem,1rem+6vw,5rem); line-height: 0.95; letter-spacing: -0.035em; margin: 1rem 0; }
  .hero h1 em { font-style: italic; color: var(--brass); }
  .hero p { color: var(--bone-dim); max-width: 50ch; margin: 0 auto; font-size: var(--fs-lede); line-height: 1.55; }

  /* billing toggle */
  .billing { display: inline-flex; align-items: center; gap: 0.3rem; margin: clamp(1.6rem,3vw,2.2rem) auto 0; padding: 0.3rem; border: 1px solid var(--line-strong); border-radius: var(--radius-pill); }
  .billing button { font-family: var(--font-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--bone-dim); background: none; border: 0; cursor: pointer; padding: 0.5rem 0.95rem; border-radius: var(--radius-pill); transition: all 0.25s var(--ease); }
  .billing button.on { background: var(--bone); color: var(--ink); }
  .billing .save { color: var(--brass); }

  /* plans */
  .plans { display: grid; gap: 16px; grid-template-columns: 1fr; margin: clamp(2rem,4vw,3rem) 0; }
  @media (min-width: 820px) { .plans { grid-template-columns: repeat(3, 1fr); align-items: start; } }
  .plan { position: relative; display: flex; flex-direction: column; gap: 1rem; border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--ink-2); padding: 1.6rem 1.5rem; }
  .plan.feat { border-color: var(--brass); background: linear-gradient(170deg, #19150d, var(--ink-2) 62%); }
  .plan__tag { position: absolute; top: -0.7rem; left: 50%; transform: translateX(-50%); font-family: var(--font-mono); font-size: 0.54rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink); background: var(--brass); padding: 0.28rem 0.7rem; border-radius: var(--radius-pill); white-space: nowrap; }
  .plan__name { font-family: var(--font-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--brass); }
  .plan__price { font-family: var(--font-serif); font-weight: 380; font-size: clamp(2.4rem,1rem+3vw,3.2rem); letter-spacing: -0.03em; line-height: 1; display: flex; align-items: baseline; gap: 0.3rem; }
  .plan__per { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.06em; color: var(--bone-faint); text-transform: none; }
  .plan__who { color: var(--bone-dim); font-size: 0.9rem; line-height: 1.5; min-height: 2.7em; }
  .plan__list { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; margin: 0.4rem 0 0.6rem; }
  .plan__list li { display: flex; gap: 0.55rem; align-items: flex-start; color: var(--bone-dim); font-size: 0.9rem; line-height: 1.45; }
  .plan__list svg { color: var(--brass); flex: 0 0 auto; margin-top: 0.1rem; }
  .plan__cta { margin-top: auto; }

  /* fees */
  .fees { border-top: 1px solid var(--line); padding: clamp(2.5rem,5vw,4rem) 0; }
  .fees__label { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--bone-dim); display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 0.9rem; }
  .fees__label span { color: var(--brass); padding-right: 0.75rem; border-right: 1px solid var(--line-strong); }
  .fees__h { font-family: var(--font-serif); font-weight: 380; font-size: var(--fs-section); letter-spacing: -0.022em; line-height: 1.02; margin-bottom: clamp(1.6rem,3vw,2.4rem); max-width: 18ch; }
  .fees__grid { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; }
  @media (min-width: 760px) { .fees__grid { grid-template-columns: repeat(3, 1fr); } }
  .fee { background: var(--ink); padding: 1.7rem 1.6rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .fee__seal { color: var(--bone-faint); margin-bottom: 0.3rem; }
  .fee__n { font-family: var(--font-serif); font-weight: 380; font-size: clamp(2.2rem,1rem+2.4vw,3rem); letter-spacing: -0.03em; line-height: 1; }
  .fee__n em { font-style: normal; color: var(--brass); }
  .fee__t { font-family: var(--font-mono); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--brass); }
  .fee__b { color: var(--bone-dim); font-size: 0.9rem; line-height: 1.55; }

  /* where the money goes */
  .split { border-top: 1px solid var(--line); padding: clamp(2.5rem,5vw,4rem) 0; display: grid; gap: clamp(1.5rem,3vw,2.4rem); grid-template-columns: 1fr; align-items: center; }
  @media (min-width: 820px) { .split { grid-template-columns: 1fr 1fr; } }
  .split h2 { font-family: var(--font-serif); font-weight: 360; font-size: clamp(1.8rem,1rem+2.4vw,2.8rem); letter-spacing: -0.025em; line-height: 1.02; }
  .split h2 em { font-style: italic; color: var(--brass); }
  .split p { color: var(--bone-dim); margin-top: 1rem; line-height: 1.6; max-width: 46ch; }
  .bars { display: flex; flex-direction: column; gap: 1.1rem; }
  .barrow__top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.4rem; }
  .barrow__k { font-family: var(--font-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); }
  .barrow__v { font-family: var(--font-mono); font-size: 0.72rem; color: var(--brass); }
  .bar { height: 12px; border-radius: 100px; background: var(--ink-3); overflow: hidden; border: 1px solid var(--line); }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brass-deep), var(--brass)); border-radius: 100px; }

  .faq { border-top: 1px solid var(--line); padding: clamp(2.5rem,5vw,4rem) 0; }
  .faq__grid { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius-card); overflow: hidden; }
  @media (min-width: 720px) { .faq__grid { grid-template-columns: 1fr 1fr; } }
  .qa { background: var(--ink); padding: 1.4rem 1.5rem; }
  .qa h3 { font-family: var(--font-serif); font-weight: 440; font-size: 1.15rem; letter-spacing: -0.01em; margin-bottom: 0.5rem; }
  .qa p { color: var(--bone-dim); font-size: 0.9rem; line-height: 1.55; }

  .close { text-align: center; padding: clamp(3rem,6vw,5.5rem) 0; border-top: 1px solid var(--line); }
  .close__seal { color: var(--brass); margin: 0 auto 1.3rem; }
  .close h2 { font-family: var(--font-serif); font-weight: 350; font-size: clamp(2rem,1rem+4vw,3.8rem); letter-spacing: -0.03em; line-height: 0.98; }
  .close h2 em { font-style: italic; color: var(--brass); }
  .close p { color: var(--bone-dim); max-width: 42ch; margin: 1.1rem auto 1.9rem; }
  .close__cta { display: flex; gap: 0.9rem; justify-content: center; flex-wrap: wrap; }

  .foot { border-top: 1px solid var(--line); padding: 2.5rem var(--gutter-app); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1.2rem; align-items: center; }
  .foot__nav { display: flex; flex-wrap: wrap; gap: 1.4rem; }
  .foot a { font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); transition: color 0.25s var(--ease); }
  .foot a:hover { color: var(--bone); }
  .foot .m { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; color: var(--bone-faint); }

  .grain { position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0.045; mix-blend-mode: overlay; background-image: var(--grain-url); }
</style>
