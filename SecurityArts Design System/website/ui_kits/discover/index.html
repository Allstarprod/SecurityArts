<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--bone); font-family: var(--font-sans); font-weight: 360; font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; transition: background var(--dur-mid) var(--ease), color var(--dur-mid) var(--ease); }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--brass); color: var(--selection-fg, var(--ink)); }

  .appbar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: clamp(0.6rem,1.6vw,1.2rem); padding: 0.85rem var(--gutter-app); background: color-mix(in srgb, var(--ink) 90%, transparent); backdrop-filter: blur(var(--blur-bar)); border-bottom: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 0.6rem; flex: 0 0 auto; }
  .brand svg { transition: transform 0.9s var(--ease); }
  .brand:hover svg { transform: rotate(22.5deg); }
  .brand__word { font-family: var(--font-serif); font-weight: 460; font-size: 1.28rem; letter-spacing: -0.01em; }
  .brand__sub { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.22em; color: var(--brass); text-transform: uppercase; align-self: flex-start; margin-top: 0.15rem; }
  .searchform { position: relative; flex: 1 1 auto; max-width: 440px; margin-inline: auto; }
  .appbar__actions { display: flex; align-items: center; gap: 0.5rem; flex: 0 0 auto; }
  .navlink { display: inline-flex; align-items: center; gap: 0.45rem; position: relative; font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); padding: 0.55rem 0.7rem; border-radius: var(--radius-pill); transition: color 0.25s var(--ease), background 0.25s var(--ease); cursor: pointer; background: none; border: 0; }
  .navlink:hover { color: var(--bone); background: var(--ink-3); }
  .navlink__count { color: var(--brass); font-variant-numeric: tabular-nums; }
  .navlink .dot { position: absolute; top: 0.3rem; right: 0.35rem; width: 6px; height: 6px; border-radius: 50%; background: var(--brass); }
  @media (max-width: 900px) { .navlink.optional { display: none; } }
  @media (max-width: 620px) { .navlink__label { display: none; } }

  .intro { padding: clamp(2.5rem,6vw,5rem) var(--gutter-app) clamp(1.5rem,3vw,2.5rem); max-width: 1100px; }
  .intro h1 { font-family: var(--font-serif); font-weight: 340; font-optical-sizing: auto; font-size: var(--fs-title); line-height: 0.96; letter-spacing: -0.03em; margin: 1.2rem 0; }
  .intro h1 em { font-style: italic; color: var(--brass); }
  .intro p { color: var(--bone-dim); max-width: 56ch; font-size: var(--fs-lede); }
  .intro p strong { color: var(--bone); font-weight: 460; }

  .filterbar { position: sticky; top: 60px; z-index: 50; display: flex; align-items: center; gap: 1rem; padding: 0.85rem var(--gutter-app); background: color-mix(in srgb, var(--ink) 92%, transparent); backdrop-filter: blur(var(--blur-panel)); border-bottom: 1px solid var(--line); }
  .chips { display: flex; gap: 0.5rem; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; }
  .chips::-webkit-scrollbar { display: none; }
  .count { flex: 0 0 auto; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--bone-faint); white-space: nowrap; }
  @media (max-width: 720px) { .count { display: none; } }

  .board { padding: clamp(1.5rem,3vw,2.5rem) var(--gutter-app) 5rem; column-width: 260px; column-gap: 16px; }
  .board .sa-pin { margin: 0 0 16px; }
  .pinlink { display: block; break-inside: avoid; margin: 0 0 16px; }
  .pinlink .sa-pin { margin: 0; }
  @media (max-width: 540px) { .board { column-width: 160px; column-gap: 12px; } .pinlink { margin-bottom: 12px; } }
  .empty { padding: 4rem var(--gutter-app) 6rem; text-align: center; }
  .empty h2 { font-family: var(--font-serif); font-weight: 360; font-size: clamp(1.6rem,1rem+2vw,2.4rem); letter-spacing: -0.02em; margin-bottom: 0.6rem; }
  .empty p { color: var(--bone-dim); }

  .foot { border-top: 1px solid var(--line); padding: 2.5rem var(--gutter-app); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1.2rem; align-items: center; }
  .foot a { font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); transition: color 0.25s var(--ease); }
  .foot a:hover { color: var(--bone); }
  .foot .m { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; color: var(--bone-faint); }

  /* likes drawer */
  .like-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.6rem 0; border-bottom: 1px solid var(--line); }
  .like-row__thumb { width: 48px; height: 60px; border-radius: var(--radius-sm); overflow: hidden; flex: 0 0 auto; background: var(--ink); }
  .like-row__thumb img { width: 100%; height: 100%; object-fit: cover; }
  .like-row__main { flex: 1 1 auto; min-width: 0; }
  .like-row__title { font-family: var(--font-serif); font-weight: 440; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .like-row__artist { font-family: var(--font-mono); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--bone-faint); margin-top: 0.15rem; }
  .likes-empty { color: var(--bone-dim); text-align: center; padding: 2.5rem 0; font-size: 0.9rem; line-height: 1.5; }

  /* verify modal bits */
  .mhead { padding: 1.6rem clamp(1.25rem,3vw,2.2rem) 1rem; }
  .meyebrow { font-family: var(--font-mono); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.18em; color: var(--brass); }
  .mtitle { font-family: var(--font-serif); font-weight: 360; font-size: clamp(1.7rem,1rem+2vw,2.4rem); line-height: 1.02; letter-spacing: -0.02em; margin-top: 0.5rem; }
  .mbody { padding: 0 clamp(1.25rem,3vw,2.2rem) 1.8rem; }
  .msub { color: var(--bone-dim); font-size: 0.92rem; margin-bottom: 1.4rem; max-width: 48ch; }
  .dropzone { border: 1.5px dashed var(--line-strong); border-radius: var(--radius-card); padding: 2rem 1.5rem; text-align: center; cursor: pointer; transition: all 0.25s var(--ease); background: var(--ink); }
  .dropzone:hover { border-color: var(--brass); background: var(--ink-3); }
  .dropzone p { font-size: 0.92rem; color: var(--bone-dim); margin-top: 0.9rem; }
  .dropzone p b { color: var(--bone); }
  .dropzone small { display: block; margin-top: 0.4rem; font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--bone-faint); }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; margin-top: 1.2rem; }
  @media (max-width: 600px) { .fields { grid-template-columns: 1fr; } }
  .mactions { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-top: 1.5rem; align-items: center; }
  .mnote { font-size: 0.74rem; color: var(--bone-faint); line-height: 1.5; margin-top: 1.1rem; }

  .grain { position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0.045; mix-blend-mode: overlay; background-image: var(--grain-url); }
