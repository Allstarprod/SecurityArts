<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marketplace — SecurityArts</title>
<script>try{var t=localStorage.getItem('sa-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="icon" href="../../assets/favicon.svg" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--bone); font-family: var(--font-sans); font-weight: 360; font-size: var(--fs-body); line-height: var(--lh-body); -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--brass); color: var(--ink); }

  .appbar { position: sticky; top: 0; z-index: 60; display: flex; align-items: center; gap: clamp(0.7rem,2vw,1.5rem); padding: 0.85rem var(--gutter-app); background: color-mix(in srgb, var(--ink) 90%, transparent); backdrop-filter: blur(var(--blur-bar)); border-bottom: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 0.6rem; flex: 0 0 auto; }
  .brand svg { transition: transform 0.9s var(--ease); }
  .brand:hover svg { transform: rotate(22.5deg); }
  .brand__word { font-family: var(--font-serif); font-weight: 460; font-size: 1.28rem; letter-spacing: -0.01em; }
  .brand__sub { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.22em; color: var(--brass); text-transform: uppercase; align-self: flex-start; margin-top: 0.15rem; }
  .searchform { position: relative; flex: 1 1 auto; max-width: 480px; margin-inline: auto; }
  .appbar__actions { display: flex; align-items: center; gap: 0.55rem; flex: 0 0 auto; }
  .applink { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); padding: 0.5rem 0.3rem; transition: color 0.25s var(--ease); }
  .applink:hover { color: var(--bone); }

  .intro { padding: clamp(2.5rem,6vw,5rem) var(--gutter-app) clamp(1.5rem,3vw,2.5rem); max-width: 1100px; }
  .intro h1 { font-family: var(--font-serif); font-weight: 340; font-optical-sizing: auto; font-size: var(--fs-title); line-height: 0.96; letter-spacing: -0.03em; margin: 1.2rem 0; }
  .intro h1 em { font-style: italic; color: var(--brass); }
  .intro p { color: var(--bone-dim); max-width: 56ch; font-size: var(--fs-lede); }
  .intro p strong { color: var(--bone); font-weight: 460; }

  .toolbar { position: sticky; top: 60px; z-index: 50; display: flex; align-items: center; gap: 1rem; padding: 0.85rem var(--gutter-app); background: color-mix(in srgb, var(--ink) 92%, transparent); backdrop-filter: blur(var(--blur-panel)); border-bottom: 1px solid var(--line); }
  .chips { display: flex; gap: 0.5rem; overflow-x: auto; scrollbar-width: none; flex: 1 1 auto; }
  .chips::-webkit-scrollbar { display: none; }
  .sortwrap { flex: 0 0 auto; display: flex; align-items: center; gap: 0.5rem; }
  .sortwrap label { font-family: var(--font-mono); font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--bone-faint); }
  @media (max-width: 680px) { .sortwrap label { display: none; } }

  .grid { padding: clamp(1.5rem,3vw,2.5rem) var(--gutter-app) 5rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: clamp(1rem,2vw,1.5rem); }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; } }
  .empty { padding: 4rem var(--gutter-app) 6rem; text-align: center; }
  .empty h2 { font-family: var(--font-serif); font-weight: 360; font-size: clamp(1.6rem,1rem+2vw,2.4rem); letter-spacing: -0.02em; margin-bottom: 0.6rem; }
  .empty p { color: var(--bone-dim); }

  .foot { border-top: 1px solid var(--line); padding: 2.5rem var(--gutter-app); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1.2rem; align-items: center; }
  .foot a { font-family: var(--font-mono); font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); transition: color 0.25s var(--ease); }
  .foot a:hover { color: var(--bone); }
  .foot .m { font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.14em; color: var(--bone-faint); }

  /* quick view */
  .qv { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 720px) { .qv { grid-template-columns: 1fr 1fr; } }
  .qv__art { position: relative; min-height: 280px; background: var(--ink); }
  .qv__art img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  .qv__body { padding: clamp(1.4rem,3vw,2.2rem); }
  .qv__eyebrow { font-family: var(--font-mono); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--brass); }
  .qv__title { font-family: var(--font-serif); font-weight: 400; font-size: clamp(1.7rem,1rem+2vw,2.4rem); line-height: 1.02; letter-spacing: -0.02em; margin: 0.5rem 0 0.3rem; }
  .qv__artist { color: var(--bone-dim); margin-bottom: 1rem; }
  .qv__artist b { color: var(--brass); font-weight: 500; }
  .qv__artist a { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; transition: text-decoration-color 0.2s var(--ease); }
  .qv__artist a:hover { text-decoration-color: var(--brass); }
  .qv__artist a:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; border-radius: 2px; }
  .qv__desc { color: var(--bone-dim); font-size: 0.92rem; margin-bottom: 1.3rem; }
  .lic { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.4rem; }
  .qv__actions { display: flex; gap: 0.7rem; flex-wrap: wrap; }

  /* cart + checkout */
  .citem { display: flex; gap: 0.85rem; padding: 0.9rem 0; border-bottom: 1px solid var(--line); }
  .citem__thumb { width: 56px; height: 70px; border-radius: var(--radius-sm); overflow: hidden; flex: 0 0 auto; background: var(--ink); }
  .citem__thumb img { width: 100%; height: 100%; object-fit: cover; }
  .citem__main { flex: 1 1 auto; min-width: 0; }
  .citem__title { font-family: var(--font-serif); font-size: 1rem; font-weight: 440; }
  .citem__lic { font-family: var(--font-mono); font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--bone-faint); margin-top: 0.2rem; }
  .citem__price { font-family: var(--font-mono); font-size: 0.8rem; color: var(--brass); margin-top: 0.35rem; }
  .cart-empty { color: var(--bone-dim); text-align: center; padding: 3rem 0; }
  .cart-sub { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1rem; }
  .cart-sub span:first-child { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); }
  .cart-sub span:last-child { font-family: var(--font-serif); font-size: 1.7rem; }
  .checkout { padding: clamp(1.5rem,3vw,2.4rem); }
  .checkout__eyebrow { font-family: var(--font-mono); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--brass); }
  .checkout__title { font-family: var(--font-serif); font-weight: 360; font-size: clamp(1.7rem,1rem+2vw,2.4rem); letter-spacing: -0.02em; margin: 0.4rem 0 1.3rem; }
  .cksum { border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 1rem 1.1rem; margin-bottom: 1.4rem; }
  .ckline { display: flex; justify-content: space-between; gap: 1rem; padding: 0.45rem 0; font-size: 0.9rem; color: var(--bone-dim); }
  .ckline b { color: var(--bone); font-weight: 460; }
  .cktotal { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); margin-top: 0.5rem; padding-top: 0.8rem; }
  .cktotal span:first-child { font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--bone-dim); }
  .cktotal span:last-child { font-family: var(--font-serif); font-size: 1.8rem; }
  .ckfields { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; margin-bottom: 1.4rem; }
  @media (max-width: 600px) { .ckfields { grid-template-columns: 1fr; } }
  .cknote { font-size: 0.72rem; color: var(--bone-faint); margin-top: 1rem; line-height: 1.5; }
  .ckdone { text-align: center; padding: 1rem 0 0.5rem; }
  .ckdone h3 { font-family: var(--font-serif); font-weight: 400; font-size: clamp(1.6rem,1rem+2vw,2.2rem); letter-spacing: -0.02em; margin-bottom: 0.6rem; }
  .ckdone p { color: var(--bone-dim); margin-bottom: 0.4rem; }
  .ckdone .oid { font-family: var(--font-mono); font-size: 0.8rem; color: var(--brass); letter-spacing: 0.1em; }

  .grain { position: fixed; inset: 0; z-index: 100; pointer-events: none; opacity: 0.045; mix-blend-mode: overlay; background-image: var(--grain-url); }
</style>
</head>
