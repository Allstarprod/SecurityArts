<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="faithful-title">
  <title id="faithful-title">SecurityArts seal</title>
  <!--
    FAITHFUL — the control sample.
    Exact original geometry (seal.svg, 100-box) scaled x2.4 and centred at 120,120:
      scallop  : 16 semicircular lobes r=17.33 on a base circle r=88.8
      ring     : r=64.8
      star     : outer R=37.2, inner R=15.36
    Strokes lifted from 5.04/3.6 to 6/4.4 so the scallops and ring still hold at 58px.
    Ink grain is displacement only (feTurbulence + feDisplacementMap, scale 2.4).
    Single ink: chop-red #D42228 on transparent. Intended surface: cream #F5F4EF.
  -->
  <defs>
    <filter id="faithful-grain" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="7" result="faithful-noise"/>
      <feDisplacementMap in="SourceGraphic" in2="faithful-noise" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <g filter="url(#faithful-grain)" fill="none" stroke="#D42228" stroke-linejoin="round">
    <!-- scalloped edge -->
    <path stroke-width="6" d="M 120 31.2
      A 17.33 17.33 0 0 1 153.982 37.959
      A 17.33 17.33 0 0 1 182.791 57.209
      A 17.33 17.33 0 0 1 202.041 86.018
      A 17.33 17.33 0 0 1 208.8 120
      A 17.33 17.33 0 0 1 202.041 153.982
      A 17.33 17.33 0 0 1 182.791 182.791
      A 17.33 17.33 0 0 1 153.982 202.041
      A 17.33 17.33 0 0 1 120 208.8
      A 17.33 17.33 0 0 1 86.018 202.041
      A 17.33 17.33 0 0 1 57.209 182.791
      A 17.33 17.33 0 0 1 37.959 153.982
      A 17.33 17.33 0 0 1 31.2 120
      A 17.33 17.33 0 0 1 37.959 86.018
      A 17.33 17.33 0 0 1 57.209 57.209
      A 17.33 17.33 0 0 1 86.018 37.959
      A 17.33 17.33 0 0 1 120 31.2 Z"/>
    <!-- ring -->
    <circle cx="120" cy="120" r="64.8" stroke-width="4.4"/>
    <!-- star -->
    <path fill="#D42228" stroke="none" d="M 120 82.8
      L 129.024 107.568 L 155.376 108.504 L 134.616 124.752 L 141.864 150.096
      L 120 135.36 L 98.136 150.096 L 105.384 124.752 L 84.624 108.504 L 110.976 107.568 Z"/>
  </g>
</svg>
