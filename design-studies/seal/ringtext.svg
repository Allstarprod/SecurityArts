<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="ringtext-title">
  <title id="ringtext-title">SecurityArts seal</title>
  <!--
    RINGTEXT — the original seal, with a legend.

    Geometry is seal.svg scaled x2.4 and left alone: 16 semicircular lobes (r 17.33) on a
    base circle r 88.8, ring r 64.8, star R 37.2 / r 15.36. Strokes 6 / 4.4 (same lift as
    faithful.svg, original 2.1 : 1.5 ratio kept) so the scallops and ring hold at 58px.

    The legend sits on a textPath at r 72, in the clear band between the ring's outer edge
    (r 67) and the scallop cusps' inner edge (r 85.8): caps run r 72–81, ~5 units of air on
    each side. It turns once every 28s, counter-clockwise so successive letters arrive at
    12 o'clock the way a ticker does. At rest "SEALED BY SECURITYARTS" is centred at
    12 o'clock, the middots sit at 3 and 9, "A RECEIPT FOR YOUR ART" runs under the bottom.
    textLength pins the run to the circumference so the loop closes seamlessly in any
    fallback font; letter-spacing is the value that lands it there in Instrument Sans.

    Colour: the mark stays chop-red like every other treatment — the seal is always
    chop-red — and the legend is ink. chop-red on cream is 2.6:1, fine for 6-unit shapes
    but not for 13-unit type; ink on cream is 16.5:1. Grain (edge displacement + uneven ink
    density) touches the chop-red geometry only, so the type stays crisp and the spinning
    group carries no filter.

    Transparent; intended surface is cream #F5F4EF. Everything is centred on 0,0 inside
    translate(120 120) so the spin pivots on the local origin — transform-box/origin are
    pinned so a host stylesheet cannot move it. Every id, class and keyframe is prefixed
    "ringtext-" so several treatments can be inlined on one page.
  -->
  <style>
    .ringtext-spin { transform-box: view-box; transform-origin: 0 0; animation: ringtext-spin 28s linear infinite; }
    @keyframes ringtext-spin { to { transform: rotate(-360deg); } }
    @media (prefers-reduced-motion: reduce) { .ringtext-spin { animation: none; } }
  </style>
  <defs>
    <!-- One full turn at r 72 (circumference 452.4), starting 4.6deg above 9 o'clock. -->
    <path id="ringtext-path" d="M-71.77,-5.77 A72,72 0 1 1 71.77,5.77 A72,72 0 1 1 -71.77,-5.77"/>
    <filter id="ringtext-grain" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" result="ringtext-edge"/>
      <feDisplacementMap in="SourceGraphic" in2="ringtext-edge" scale="2" xChannelSelector="R" yChannelSelector="G" result="ringtext-rough"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="3" seed="4" result="ringtext-press"/>
      <feComponentTransfer in="ringtext-press" result="ringtext-density">
        <feFuncA type="table" tableValues="0.55 0.8 1 1 1"/>
      </feComponentTransfer>
      <feComposite in="ringtext-rough" in2="ringtext-density" operator="in"/>
    </filter>
  </defs>
  <g transform="translate(120 120)">
    <!-- The mark: original geometry x2.4. -->
    <g filter="url(#ringtext-grain)" fill="none" stroke="#D42228" stroke-linejoin="round">
      <!-- scalloped edge -->
      <path stroke-width="6" d="M0,-88.8 A17.33,17.33 0 0 1 33.98,-82.04 A17.33,17.33 0 0 1 62.79,-62.79 A17.33,17.33 0 0 1 82.04,-33.98 A17.33,17.33 0 0 1 88.8,0 A17.33,17.33 0 0 1 82.04,33.98 A17.33,17.33 0 0 1 62.79,62.79 A17.33,17.33 0 0 1 33.98,82.04 A17.33,17.33 0 0 1 0,88.8 A17.33,17.33 0 0 1 -33.98,82.04 A17.33,17.33 0 0 1 -62.79,62.79 A17.33,17.33 0 0 1 -82.04,33.98 A17.33,17.33 0 0 1 -88.8,0 A17.33,17.33 0 0 1 -82.04,-33.98 A17.33,17.33 0 0 1 -62.79,-62.79 A17.33,17.33 0 0 1 -33.98,-82.04 A17.33,17.33 0 0 1 0,-88.8 Z"/>
      <!-- ring -->
      <circle r="64.8" stroke-width="4.4"/>
      <!-- star -->
      <path fill="#D42228" stroke="none" d="M0,-37.2 L9.02,-12.43 L35.38,-11.5 L14.62,4.75 L21.86,30.1 L0,15.36 L-21.86,30.1 L-14.62,4.75 L-35.38,-11.5 L-9.02,-12.43 Z"/>
    </g>
    <!-- The legend. Trailing character is a no-break space so the loop closes with the same gap it opens with. -->
    <g class="ringtext-spin">
      <text font-family="Instrument Sans, Inter, system-ui, sans-serif" font-weight="700" font-size="13" letter-spacing="1.8" fill="#171A1F" textLength="452" lengthAdjust="spacing"><textPath href="#ringtext-path">SEALED BY SECURITYARTS · A RECEIPT FOR YOUR ART ·&#160;</textPath></text>
    </g>
  </g>
</svg>
