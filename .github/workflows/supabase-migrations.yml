name: Supabase Migrations

# Applies any new supabase/migrations/*.sql to the live database on push to main.
# Already-applied migrations are skipped by the CLI (it tracks remote history), so
# this is safe to run every time. Stays GREEN until the two secrets are configured:
#   SUPABASE_ACCESS_TOKEN  → supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   → your project's database password
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: guard
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Supabase secrets not set — skipping migration push."
            echo "Add SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD in repo Settings → Secrets to enable."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.enabled == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - if: steps.guard.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref ixdkfakibuctwhgwngsw
          supabase db push
