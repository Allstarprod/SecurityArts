name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install build tooling
        run: npm ci
      - name: Verify compiled pages are in sync with their .jsx sources
        run: npm run build:check
      # Not in the Vercel build: .vercelignore keeps the token sources off the deploy.
      - name: Verify design-system/tokens.css matches tokens.json
        run: npm run tokens:check
      - name: Token build tests
        run: npm run test:tokens
      - name: Page structure checks
        run: npm run test:pages

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check all server modules
        working-directory: server
        run: |
          for f in server.mjs routes.mjs lib/*.mjs lib/drivers/*.mjs test/e2e.mjs; do
            node --check "$f"
          done

      - name: Boot server (file driver) and run e2e suite
        working-directory: server
        run: |
          PORT=8137 node server.mjs &
          SRV=$!
          for i in $(seq 1 20); do
            curl -sf http://localhost:8137/api/health > /dev/null && break
            sleep 0.5
          done
          node test/e2e.mjs file
          kill $SRV
